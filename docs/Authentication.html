<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomee Auth Debugger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Bố cục: mục lục dính bên trái + một cột nội dung; debugger kiểu IDE nằm đầu trang, mỗi tầng một màu nhấn */
  --bg:#151922; --panel:#1b202b; --panel2:#222836; --line:#2f3648; --text:#e8ebf2; --muted:#a0a9bb; --dim:#6d7690;
  --accent:#7cc4ff; --ok:#5ee08f; --err:#ff7373; --warn:#f6c453;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-code:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --l-ui:#5ec8f2; --l-bloc:#8f9dff; --l-repo:#bc93ff; --l-net:#a9b2c4; --l-router:#ffb86b; --l-mw:#ffd84d;
  --l-ctrl:#6ee7a8; --l-svc:#36d7c6; --l-db:#f78fb3; --l-mail:#ff8a7a; --l-inbox:#e3c7ff;
  --lh:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.65 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code,kbd,pre,.mono{font-family:var(--font-code);font-size:12.8px}
h1,h2,h3,h4{text-wrap:balance;line-height:1.25;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--l-ui),var(--l-svc),var(--l-db));z-index:50}

/* ---------- khung ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;max-width:1480px;margin:0 auto}
nav#toc{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 40px 18px;border-right:1px solid var(--line);font-size:13.5px}
nav#toc .brand{font-weight:800;letter-spacing:-.01em;font-size:15px;margin-bottom:2px}
nav#toc .brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
nav#toc h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:18px 0 6px}
nav#toc a{display:flex;gap:8px;align-items:baseline;color:var(--muted);text-decoration:none;padding:3px 8px;border-radius:6px;line-height:1.35}
nav#toc a:hover{color:var(--text);background:var(--panel)}
nav#toc a.on{color:var(--text);background:var(--panel2)}
nav#toc a .n{font-family:var(--font-code);font-size:11px;color:var(--dim);min-width:22px}
nav#toc .sub{margin:2px 0 4px 22px;display:none}
nav#toc .sub.open{display:block}
nav#toc .sub a{font-size:12.5px;padding:2px 8px}
main{min-width:0;padding:28px 34px 120px}
.wrap{max-width:1120px;margin:0 auto}
.prose{max-width:75ch}
#tocbtn{display:none}

header.top h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
header.top .lede{color:var(--muted);max-width:75ch;margin:10px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
section.block{margin-top:56px}
section.block > h2{font-size:24px;font-weight:800;letter-spacing:-.01em;display:flex;gap:12px;align-items:baseline}
section.block > h2 .k{font-family:var(--font-code);font-size:13px;color:var(--dim);font-weight:400}
.intro{color:var(--muted);max-width:75ch;margin:8px 0 18px}

/* lane colors */
.ln-ui{--c:var(--l-ui)}.ln-bloc{--c:var(--l-bloc)}.ln-repo{--c:var(--l-repo)}.ln-net{--c:var(--l-net)}.ln-router{--c:var(--l-router)}
.ln-mw{--c:var(--l-mw)}.ln-ctrl{--c:var(--l-ctrl)}.ln-svc{--c:var(--l-svc)}.ln-db{--c:var(--l-db)}.ln-mail{--c:var(--l-mail)}.ln-inbox{--c:var(--l-inbox)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--c,var(--muted));border:1px solid color-mix(in srgb,var(--c,#888) 45%,transparent);background:color-mix(in srgb,var(--c,#888) 12%,transparent);padding:1px 8px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted))}

/* ---------- debugger ---------- */
.dbg{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.dbg-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.tab:hover{color:var(--text)}
.tab.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.tab .n{font-family:var(--font-code);font-size:11px;opacity:.75;margin-right:4px}
.scen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on.okb{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.seg button.on.errb{background:color-mix(in srgb,var(--err) 22%,transparent);color:var(--err)}
.errpick{display:flex;flex-wrap:wrap;gap:6px}
.errpick button{border:1px dashed color-mix(in srgb,var(--err) 50%,transparent);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
.errpick button.on{border-style:solid;color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent)}
.scdesc{flex-basis:100%;color:var(--muted);font-size:13.5px;margin:0}
.scdesc b{color:var(--text)}

.lanes{overflow-x:auto;border-bottom:1px solid var(--line);background:#181c26}
.lanes svg{display:block}
.lanes .rowbg{fill:transparent;transition:fill .25s}
.lanes .rowbg.alt{fill:rgba(255,255,255,.015)}
.lanes .rowbg.on{fill:color-mix(in srgb,var(--c) 14%,transparent)}
.lanes .lbl{font:600 11.5px var(--font-body);fill:var(--muted)}
.lanes .lbl.on{fill:var(--c)}
.lanes .lsub{font:10px var(--font-body);fill:var(--dim)}
.lanes .trail{fill:none;stroke:var(--dim);stroke-width:1.4;stroke-dasharray:3 4;opacity:.6}
.lanes .done{fill:none;stroke:var(--accent);stroke-width:2;opacity:.9}
.lanes .dot{cursor:pointer}
.lanes .dot circle{fill:var(--panel2);stroke:var(--c);stroke-width:1.6}
.lanes .dot.past circle{fill:var(--c)}
.lanes .dot:hover circle{stroke-width:3}
.lanes .pk{transition:transform .45s cubic-bezier(.4,.1,.2,1)}
.lanes .pk circle.core{fill:#fff}
.lanes .pk circle.halo{fill:var(--c);opacity:.55;filter:url(#glow)}
.lanes .pk text{font:600 10.5px var(--font-code);fill:var(--text);paint-order:stroke;stroke:#181c26;stroke-width:4px}
.lanes .errx{font:700 13px var(--font-body);fill:var(--err)}

.cap{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.cap .no{font-family:var(--font-code);font-size:12px;color:var(--dim)}
.cap .tt{font-weight:600;flex:1 1 320px}
.cap .time{font-family:var(--font-code);font-size:12px;color:var(--muted)}
.cap .why{flex-basis:100%;color:var(--muted);font-size:13.5px;margin:0;max-width:95ch}
.linkbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 10px;font-size:12.5px;color:var(--accent);cursor:pointer}
.linkbtn:hover{background:var(--panel2)}

.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.grid2 > *{min-width:0}
.pane{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.pane:last-child{border-right:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);padding:7px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.ph .path{max-width:100%;font-family:var(--font-code);text-transform:none;letter-spacing:0;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{padding:8px 12px;font-size:13px}

.code{font-family:var(--font-code);font-size:12.6px;line-height:var(--lh);overflow-x:auto;tab-size:2;position:relative}
.code .row{display:flex;min-width:max-content;position:relative}
.code .g{flex:0 0 64px;text-align:right;padding-right:12px;color:var(--dim);user-select:none;position:relative}
.code .s{white-space:pre;padding-right:16px}
.code .row.hl{background:rgba(124,196,255,.07)}
.code .row.cur{background:rgba(246,196,83,.16)}
.code .row.cur .g{color:var(--warn)}
.code .row.cur .g::before{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--err)}
.code .row.cur .g::after{content:"➜";position:absolute;left:17px;top:0;color:var(--warn);font-size:12px}
.code .row.hot{background:rgba(124,196,255,.18)}
.code.dbgcode{max-height:calc(var(--lh)*17 + 12px);padding:6px 0}

.k-kw{color:#d49cf5}.k-str{color:#a8e3a1}.k-num{color:#f7a76c}.k-com{color:#6f7a95;font-style:italic}.k-fn{color:#82b1ff}.k-ty{color:#ffd27a}.k-at{color:#f78fb3}.k-key{color:#7fd3e8}

.watch{font-family:var(--font-code);font-size:12.3px;max-height:340px;overflow:auto}
.watch .w{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:10px;padding:3px 12px;border-bottom:1px dashed rgba(255,255,255,.04)}
.watch .w .nm{color:var(--k,#7fd3e8);overflow-wrap:anywhere}
.watch .w .vl{color:var(--text);overflow-wrap:anywhere;white-space:pre-wrap}
.watch .w.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:rgba(246,196,83,.38)}100%{background:transparent}}
.watch .empty,.muted{color:var(--dim)}
.stack{list-style:none;margin:0;padding:6px 0;font-family:var(--font-code);font-size:12px}
.stack li{padding:2px 12px;color:var(--muted);display:flex;gap:8px}
.stack li:first-child{color:var(--text);background:rgba(246,196,83,.1)}
.stack li span.i{color:var(--dim);min-width:14px}
.net{font-family:var(--font-code);font-size:12px;padding:8px 12px;display:grid;gap:8px}
.net .lbl{color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.net pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.st{display:inline-block;border-radius:6px;padding:0 6px;font-weight:600}
.st.s2{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.st.s4,.st.s5{background:color-mix(in srgb,var(--err) 20%,transparent);color:var(--err)}

.dbtabs{padding:8px 12px;display:grid;gap:12px;overflow-x:auto}
.dbt{width:100%;border-collapse:collapse;font-family:var(--font-code);font-size:11.8px}
.dbt caption{text-align:left;font:600 12px var(--font-body);color:var(--l-db);padding:0 0 4px}
.dbt caption span{color:var(--dim);font-weight:400}
.dbt th{text-align:left;color:var(--dim);font-weight:400;border-bottom:1px solid var(--line);padding:3px 8px;white-space:nowrap}
.dbt td{border-bottom:1px solid rgba(255,255,255,.04);padding:3px 8px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.dbt td.chg{background:color-mix(in srgb,var(--warn) 24%,transparent);color:#fff}
.dbt tr.new td{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.dbt tr.del td{text-decoration:line-through;color:var(--err);background:color-mix(in srgb,var(--err) 10%,transparent)}
.dbt td.none{color:var(--dim);font-style:italic}

.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel2)}
.ctrl button.b{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:40px;height:34px;cursor:pointer;font-size:14px}
.ctrl button.b:hover{border-color:var(--accent)}
.ctrl button.b.play{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700;min-width:72px}
.ctrl input[type=range]{flex:1 1 220px;accent-color:var(--accent)}
.ctrl select{background:var(--panel);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 8px}
.ctrl .cnt{font-family:var(--font-code);font-size:12px;color:var(--muted);min-width:64px;text-align:right}
.kbd{font-size:12px;color:var(--dim)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}

/* ---------- sơ đồ trạng thái ---------- */
.sm{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow-x:auto;padding:8px}
.sm svg{display:block;min-width:820px;width:100%;height:auto}
.sm .node rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.2}
.sm .node.trans rect{stroke-dasharray:5 4}
.sm .node text{fill:var(--text);font:600 13px var(--font-body)}
.sm .node text.s{fill:var(--muted);font:11px var(--font-code)}
.sm .edge path{fill:none;stroke:var(--c);stroke-width:1.7;opacity:.85}
.sm .edge text{font:600 11.5px var(--font-body);fill:var(--c)}
.sm .edge rect{fill:var(--panel)}
.sm .edge{cursor:pointer}
.sm .edge:hover path{stroke-width:3;opacity:1}
.sm .edge.static{cursor:default}

/* ---------- các mục chi tiết ---------- */
.flowhead{margin-top:72px;padding-top:8px;border-top:1px solid var(--line)}
.flowhead .row1{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.flowhead .fno{font:800 13px var(--font-code);color:var(--bg);background:var(--accent);border-radius:8px;padding:2px 9px}
.flowhead h2{font-size:26px;font-weight:800;letter-spacing:-.015em}
.flowhead .ep{font-family:var(--font-code);font-size:13px;color:var(--l-router);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.flowhead p{color:var(--muted);max-width:75ch}
.idea{border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 7%,transparent);border-radius:10px;padding:10px 14px;max-width:75ch;margin:12px 0;font-size:14.5px}
.idea b{color:var(--warn)}
.step{margin-top:34px;scroll-margin-top:20px}
.step.flashme{animation:flash2 1.8s ease-out}
@keyframes flash2{0%{box-shadow:0 0 0 3px var(--warn);border-radius:10px}100%{box-shadow:0 0 0 0 transparent}}
.shead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.shead .sno{font:700 13px var(--font-code);color:var(--accent);min-width:34px}
.shead h3{font-size:18px;font-weight:700}
.shead .loc{font-family:var(--font-code);font-size:12px;color:var(--muted)}
.sum{max-width:75ch;margin:8px 0 12px}
.ca{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,1fr);border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:10px 0;overflow:hidden}
.ca .ch{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);font-family:var(--font-code);font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.015)}
.ca .code{padding:6px 0;border-right:1px solid var(--line)}
.ca > *{min-width:0}
.ca .notes{position:relative;font-size:13.2px;line-height:1.5;overflow-wrap:anywhere}
.note{position:absolute;left:10px;right:10px;border-left:3px solid var(--c,var(--accent));padding:3px 8px 4px;border-radius:0 6px 6px 0;background:var(--panel2);cursor:pointer;transition:background .15s}
.note .lr{font-family:var(--font-code);font-size:10.5px;color:var(--dim);margin-right:6px}
.note.hot,.note:hover{background:#2c3446}
.note::before{content:"";position:absolute;left:-13px;top:9px;width:10px;height:1px;background:var(--line)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ba > div{border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.ba h5{margin:0;padding:6px 12px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.ba pre{margin:0;padding:8px 12px;font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ba .chg{background:color-mix(in srgb,var(--warn) 22%,transparent);border-radius:3px}
.ba .add{background:color-mix(in srgb,var(--ok) 20%,transparent);border-radius:3px}
.ba .del{background:color-mix(in srgb,var(--err) 20%,transparent);border-radius:3px;text-decoration:line-through}
.br{border-left:3px solid var(--err);background:color-mix(in srgb,var(--err) 6%,transparent);border-radius:0 10px 10px 0;padding:8px 14px;margin:10px 0;max-width:90ch}
.br h5{margin:0 0 4px;font-size:12px;color:var(--err);letter-spacing:.04em;text-transform:uppercase}
.br ul{margin:0;padding-left:18px}
.br li{margin:3px 0}
.br code{color:var(--text)}
.nothandled{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 6%,transparent)}
.nothandled h5{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:7px 12px;border-bottom:1px solid var(--line)}
.tbl th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:600;background:rgba(255,255,255,.02)}
.tbl td code{font-size:12px}
.tblwrap{overflow-x:auto}
.tbl.trace td{font-size:13px}
.tbl.trace td.pick{color:var(--ok);font-weight:600}
.tbl.trace td.rej{color:var(--dim)}
.tbl.trace tr.final td{background:color-mix(in srgb,var(--ok) 8%,transparent)}
.tbl.trace tr.finalerr td{background:color-mix(in srgb,var(--err) 8%,transparent)}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cast > div{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px}
.cast h4{font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.cast .v{font-family:var(--font-code);font-size:12.5px;overflow-wrap:anywhere}

.tl{position:relative;margin:16px 0 0;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin-bottom:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 14px}
.tl .ev::before{content:"";position:absolute;left:-23px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 3px var(--bg)}
.tl .ev .when{font-family:var(--font-code);font-size:12px;color:var(--muted)}
.tl .ev .what{font-weight:600;margin:2px 0}
.tl .ev .db{font-family:var(--font-code);font-size:12px;color:var(--muted);margin-top:4px}
.tl .ev .db span{display:block}
.state{display:inline-block;font-size:12px;border-radius:6px;padding:0 8px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}

.risk{max-width:980px;display:grid;grid-template-columns:6px 1fr;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;margin:12px 0}
.risk .bar{background:var(--sv)}
.risk .in{padding:10px 16px}
.risk h4{font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sev{font-size:11px;font-weight:700;border-radius:6px;padding:1px 8px;color:var(--bg);background:var(--sv)}
.risk dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
.risk dt{color:var(--dim);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.risk dd{margin:0;max-width:75ch}
.sv-h{--sv:var(--err)}.sv-m{--sv:var(--warn)}.sv-l{--sv:#7aa8d8}.sv-ok{--sv:var(--ok)}
.gl{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.gl > div{padding:7px 12px;border-bottom:1px solid var(--line);font-size:14px}
.gl > div:nth-child(odd){font-weight:600;font-family:var(--font-code);font-size:13px;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
footer{margin-top:60px;color:var(--dim);font-size:13px}

@media (max-width:1100px){
  .shell{grid-template-columns:1fr}
  nav#toc{position:fixed;inset:0 30% 0 0;max-width:320px;z-index:40;background:var(--bg);transform:translateX(-105%);transition:transform .25s;height:100%}
  nav#toc.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #tocbtn{display:inline-flex;position:fixed;right:14px;bottom:14px;z-index:45;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 14px;cursor:pointer}
  main{padding:22px 16px 100px}
}
@media (max-width:860px){
  .grid2{grid-template-columns:1fr}
  .pane{border-right:0}
  .ca{grid-template-columns:minmax(0,1fr)}
  .ca .code{border-right:0;border-bottom:1px solid var(--line)}
  .ca .notes{padding:8px 0}
  .note{position:static;margin:6px 10px}
  .note::before{display:none}
  .ba{grid-template-columns:1fr}
  .risk dl{grid-template-columns:1fr}
  .gl{grid-template-columns:1fr}
  .gl > div:nth-child(odd){border-bottom:0;padding-bottom:0}
  header.top h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

l = await this.cacheService.get<string>(tokenKey);", "    if (!email) {", "      throw AppError.badRequest(t(\"auth.invalidResetToken\"));", "    }", "", "    // 2. Tìm user", "    const user = await this.userRepository.findOne({", "      where: { email },", "      relations: {", "        province: true,", "        ward: true,", "      },", "    });", "    if (!user) {", "      throw AppError.notFound(t(\"auth.userNotFound\"));", "    }", "", "    if (!user.isActive) {", "      throw AppError.forbidden(t(\"auth.accountInactive\"));", "    }", "", "    // 3. Băm mật khẩu mới bằng Argon2 & lưu DB", "    user.password = await argon2.hash(newPassword);", "    user.isEmailVerified = true;", "    await this.userRepository.save(user);", "", "    // 4. Thu hồi toàn bộ session đăng nhập cũ của user", "    await this.refreshTokenRepository.revokeAllUserSessions(user.id);", "", "    // 5. Xóa resetToken khỏi Redis & DB (dùng 1 lần duy nhất)", "    await this.cacheService.del(tokenKey);", "", "    // 6. Xóa key lockout / attempts của tài khoản trên mọi IP (nếu đang bị khóa)", "    try {", "      if (redis.status === \"ready\") {", "        const lockoutKeys = await redis.keys(`login:*:${email}:*`);", "        if (lockoutKeys.length > 0) {", "          await this.cacheService.del(...lockoutKeys);", "        }", "      }", "    } catch (error) {", "      console.warn(", "        `[AuthService] Clear lockout keys failed for ${email}:`,", "        error,", "      );", "    }", "", "    // 7. Tự động sinh phiên đăng nhập mới và trả về Token cho thiết bị vừa đổi mật khẩu", "    return this.createSessionAndTokens(user, deviceInfo, ipAddress);", "  }", "", "  public async getProfile(userId: string): Promise<User> {", "    const user = await this.userRepository.findOne({", "      where: { id: userId },", "      relations: {", "        province: true,", "        ward: true,", "      },", "    });", "", "    if (!user) {", "      throw AppError.notFound(t(\"auth.userNotFound\"));", "    } iled for \"${key}\":`, error);", "    }", "", "    // Nếu Redis hoạt động bình thường:", "    // Trả về dữ liệu nếu có, hoặc trả về null nếu cache miss (KHÔNG fallback xuống DB khi Redis online)", "    if (redisSuccess) {", "      if (redisVal === null) {", "        return null;", "      }", "      return this.parseValue<T>(redisVal);", "    }", "", "    // 2. Chỉ fallback xuống PostgreSQL nếu Redis lỗi hoặc mất kết nối", "    const dbRecord = await this.persistRedisRepository.getValidKey(key);", "    if (!dbRecord) {", "      return null;", "    }", "", "    // 3. Rehydrate: Nạp ngược lại vào Redis nếu còn hạn và Redis sẵn sàng", "    let remainingTtl: number | undefined;", "    if (dbRecord.expiredAt) {", "      const diffInSeconds = Math.floor(", "        (dbRecord.expiredAt.getTime() - Date.now()) / 1000,", "      );", "      if (diffInSeconds <= 0) {", "        return null;", "      }", "      remainingTtl = diffInSeconds;", "    }", "", "    try {", "      if (redis.status === \"ready\") {", "        const valStr =", "          typeof dbRecord.value === \"string\"", "            ? dbRecord.value", "            : JSON.stringify(dbRecord.value);", "", "        if (remainingTtl !== undefined && remainingTtl > 0) {", "          await redis.set(key, valStr, \"EX\", remainingTtl);", "        } else if (remainingTtl === undefined) {", "          await redis.set(key, valStr);", "        }", "      }", "    } catch (error) {", "      console.warn(`[CacheService] Rehydrate failed for \"${key}\":`, error);", "    }", "", "    return dbRecord.value as T;", "  }", "", "  /**", "   * Helper parse chuỗi trả về từ Redis (tự động parse JSON nếu là Object/Array)", "   */", "  private parseValue<T>(val: string): T {", "    const trimmed = val.trim();", "    if (", "      (trimmed.startsWith(\"{\") && trimmed.endsWith(\"}\")) ||", "      (trimmed.startsWith(\"[\") && trimmed.endsWith(\"]\"))", "    ) {", "      try {", "        return JSON.parse(trimmed) as T;", "      } catch {" idKey(key);", "    if (!dbRecord || !dbRecord.expiredAt) return -2;", "", "    const diff = Math.floor(", "      (dbRecord.expiredAt.getTime() - Date.now()) / 1000,", "    );", "    return diff > 0 ? diff : -2;", "  }", "", "  /**", "   * Tăng giá trị số của key và đồng bộ DB", "   */", "  public async incr(key: string, ttlSeconds?: number): Promise<number> {", "    if (!key) return 0;", "", "    let count: number | null = null;", "", "    try {", "      if (redis.status === \"ready\") {", "        count = await redis.incr(key);", "        if (count === 1 && ttlSeconds && ttlSeconds > 0) {", "          await redis.expire(key, ttlSeconds);", "        }", "      }", "    } catch (error) {", "      console.warn(`[CacheService] Redis incr failed for \"${key}\":`, error);", "    }", "", "    if (count === null) {", "      const dbRecord = await this.persistRedisRepository.getValidKey(key);", "      const current = Number(dbRecord?.value) || 0;", "      count = current + 1;", "    }", "", "    try {", "      await this.persistRedisRepository.setKey(key, count, ttlSeconds, {", "        preserveTtl: true,", "      });", "    } catch (error) {", "      console.warn(", "        `[CacheService] DB persist setKey failed for \"${key}\":`,", "        error,", "      );", "    }", "    return count;", "  }", "", "  /**", "   * Đặt thời gian hết hạn cho key", "   */", "  public async expire(key: string, ttlSeconds: number): Promise<void> {", "    if (!key || ttlSeconds <= 0) return;", "", "    try {", "      if (redis.status === \"ready\") {", "        await redis.expire(key, ttlSeconds);", "      }", "    } catch (error) {", "      console.warn(`[CacheService] Redis expire failed for \"${key}\":`, error);", "    }", "", "    const dbRecord = await this.persistRedisRepository.getValidKey(key);", "    if (dbRecord) {", "      await this.persistRedisRepository.setKey(", "        key,", "        dbRecord.value,", "        ttlSeconds,", "      );", "    }", "  }", "}", ""]}, "UR": {"pa "  public static badRequest(message: string, errors: any = null): AppError {", "    return new AppError(message, 400, errors);", "  }", "", "  public static unauthorized(message: string, errors: any = null): AppError {", "    return new AppError(message, 401, errors);", "  }", "", "  public static forbidden(message: string, errors: any = null): AppError {", "    return new AppError(message, 403, errors);", "  }", "", "  public static notFound(message: string, errors: any = null): AppError {", "    return new AppError(message, 404, errors);", "  }", "", "  public static conflict(message: string, errors: any = null): AppError {", "    return new AppError(message, 409, errors);", "  }", "", "  public static locked(message: string, errors: any = null): AppError {", "    return new AppError(message, 423, errors);", "  }", "", "  public static tooManyRequests(message: string, errors: any = null): AppError {", "    return new AppError(message, 429, errors);", "  }", "", "  public static internal(message: string, errors: any = null): AppError {", "    return new AppError(message, 500, errors);", "  }", "}", ""]}, "CR": {"path": "_backend/src/utils/customResponse.ts", "lang": "ts", "lines": ["export class CustomResponse {", "  public static success(", "    res: any,", "    data: any,", "    message: string = \"Success\",", "    statusCode: number = 200,", "  ): void {", "    res.status(statusCode).json({", "      success: true,", "      message,", "      data,", "    });", "  }", "", "  public static error(", "    res: any,", "    message: string = \"Internal Server Error\",", "    errors: any = null,", "    statusCode: number = 500,", "  ): void {", "    res.status(statusCode).json({", "      success: false,", "      message,", "      errors,", "    });", "  }", "}", ""]}, "APP": {"path": "_backend/src/app.ts", "lang": "ts", "lines": ["import express, { Application, Request, Response, NextFunction } from \"express\";", "import cors from \"cors\";", "import { container } from \"tsyringe\";", "import { AppDataSource } from \"./config/data-source.js\";", "import { closeRedis, redis } from \"./config/redis.js\";", "import { stopCronJobs } from \"./cron/index.js\";", "import { Routes } from \"./routes.js\";", "import { CustomResponse } from \"./utils/customResponse.js\";", "import { i18nMiddleware } from \"./middlewares/i18nMiddleware.js\";", "import { requestContextMiddleware } from \"./middlewares/requestContextMiddleware.js\";", "import { AppError } from \"./utils/appError.js\";", "import { t } from \"./utils/i18n.js\";", "import {", "  startQueueWorkers,", "  stopQueueWorkers,", "  closeAllQueues,", "} from \"./queues/index.js\";", "", "interface HttpError extends Error {", "  status?: number;", "}", "", "export class App {", "  public app: Application;", "  public port: number;", "", "  constructor(port: number = 5000) {", "    this.app = express();", "    this.port = port;", "", "    this.configureTrustProxy();", "    this.initializeMiddlewares();", "    this.initializeRoutes();", "    this.initializeErrorHandling();", "  }", "", "  private configureTrustProxy(): void {", "    const trustProxy = process.env.TRUST_PROXY;", "    if (trustProxy !== undefined) {", "      if (trustProxy === \"true\") {", "        this.app.set(\"trust proxy\", true);", "      } else if (trustProxy === \"false\") {", "        this.app.set(\"trust proxy\", false);", "      } else if (/^\\d+$/.test(trustProxy)) {", "        this.app.set(\"trust proxy\", parseInt(trustProxy, 10));", "      } else {", "        this.app.set(\"trust proxy\", trustProxy);", "      }", "    } else {", "      // Mặc định tin cậy 1 hop reverse proxy (như Nginx / Docker / Cloudflare)", "      this.app.set(\"trust proxy\", 1);", "    }", "  }", "", "  private initializeMiddlewares(): void {", "    this.app.use(cors());", "    this.app.use(express.json());", "    this.app.use(express.urlencoded({ extended: true }));", "    this.app.use(requestContextMiddleware);", "    this.app.use(i18nMiddleware);", "", "    // Request logger for development", "    if (process.env.NODE_ENV !== \"production\") {", "      this.app.use((req: Request, res: Response, next: NextFunction) => {", "        console.log(", "          `[${new Date().toISOString()}] ${req.method} ${req.originalUrl}`", "        );", "        next();", "      });", "    }", "  }", "", "  private initializeRoutes(): void {", "    // Root route", "    this.app.get(\"/\", (req: Request, res: Response) => {", "      res.json({", "        message: \"Roomee Backend Server is running\",", "        apiDocs: \"/api\",", "        health: \"/api/health\",", "      });", "    });", "", "    // Health check route", "    this.app.get(\"/api/health\", (req: Request, res: Response) => {", "      res.json({", "        status: \"UP\",", "        database: AppDataSource.isInitialized ? \"connected\" : \"disconnected\",", "        redis: redis.status === \"ready\" ? \"connected\" : \"disconnected\",", "        timestamp: new Date().toISOString(),", "        uptime: `${Math.floor(process.uptime())}s`,", "      });", "    });", "", "    // API routes", "    container.resolve(Routes).register(this.app);", "", "    // 404 Handler", "    this.app.use((req: Request, res: Response) => {", "      CustomResponse.error(", "        res,", "        t(\"common.notFound\", { path: req.originalUrl }),", "        null,", "        404,", "      );", "    });", "  }", "", "  private initializeErrorHandling(): void {", "    // Global Error Handler", "    this.app.use(", "      (err: any, req: Request, res: Response, next: NextFunction) => {", "        // 1. Lỗi nghiệp vụ có chủ đích (AppError)", "        if (err instanceof AppError) {", "          CustomResponse.error(", "            res,", "            err.message,", "            err.errors,", "            err.statusCode,", "          );", "          return;", "        }", "", "        // 2. Lỗi hệ thống / DB không mong muốn (che giấu stack trace và chi tiết SQL)", "        console.error(\"[Unhandled System Error]:\", err);", "        CustomResponse.error(", "          res,", "          t(\"common.internalServerError\"),", "          null,", "          500,", "        );", "      }", "    );", "  }", "", "  public listen(): void {", "    // Khởi động toàn bộ BullMQ Queue Workers xử lý tác vụ nền", "    startQueueWorkers();", "", "    const server = this.app.listen(this.port, () => {", "      console.log(`🚀 Server is running on http://localhost:${this.port}`);", "      console.log(`👉 Health check: http://localhost:${this.port}/api/health`);", "    });", "", "    // Graceful shutdown", "    const shutdown = async (signal: string) => {", "      console.log(`\\nReceived ${signal}. Shutting down gracefully...`);", "      stopCronJobs();", "      await stopQueueWorkers();", "      await closeAllQueues();", "      if (AppDataSource.isInitialized) {", "        await AppDataSource.destroy();", "        console.log(\"Database connection closed.\");", "      }", "      await closeRedis();", "      console.log(\"Redis connection closed.\");", "      server.close(() => {", "        console.log(\"Server closed successfully.\");", "        process.exit(0);", "      });", "    };", "", "    process.on(\"SIGINT\", () => shutdown(\"SIGINT\"));", "    process.on(\"SIGTERM\", () => shutdown(\"SIGTERM\"));", "  }", "}", "", "export default App;", ""]}, "ROUTES": {"path": "_backend/src/routes.ts", "lang": "ts", "lines": ["import { Application, Router } from \"express\";", "import { injectable } from \"tsyringe\";", "import AuthRoutes from \"./modules/auth/authRoutes.js\";", "import GeneralRoutes from \"./modules/general/generalRoutes.js\";", "import WorkspaceRoutes from \"./modules/workspace/workspaceRoutes.js\";", "import { API_PREFIX } from \"./utils/constanst.js\";", "", "@injectable()", "export class Routes {", "  constructor(", "    private authRoutes: AuthRoutes,", "    private generalRoutes: GeneralRoutes,", "    private workspaceRoutes: WorkspaceRoutes,", y> {", "  protected queue: Queue<T, R>;", "  public readonly name: string;", "", "  constructor(name: string, defaultJobOptions?: JobsOptions) {", "    this.name = name;", "    const connection = createRedisConnection();", "", "    this.queue = new Queue<T, R>(name, {", "      connection,", "      defaultJobOptions: {", "        attempts: 3,", "        backoff: {", "          type: \"exponential\",", "          delay: 2000,", "        },", "        removeOnComplete: {", "          age: 3600, // Lưu job thành công trong 1 giờ để theo dõi", "          count: 500,", "        },", "        removeOnFail: {", "          age: 86400 * 7, // Lưu job thất bại trong 7 ngày để debug", "        },", "        ...defaultJobOptions,", "      },", "    });", "  }", "", "  /**", "   * Đẩy một công việc (job) vào hàng đợi", "   */", "  public async addJob(", "    jobName: string,", "    data: T,", "    opts?: JobsOptions,", "  ): Promise<void> {", "    await this.queue.add(jobName as any, data as any, opts);", "  }", "", "  /**", "   * Đóng kết nối queue an toàn", "   */", "  public async close(): Promise<void> {", "    await this.queue.close();", "  }", "", "  /**", "   * Truy cập đối tượng BullMQ Queue gốc nếu cần thao tác nâng cao", "   */", "  public getRawQueue(): Queue<T, R> {", "    return this.queue;", "  }", "}", ""]}, "MW": {"path": "_backend/src/queues/mail/mailWorker.ts", "lang": "ts", "lines": ["import { injectable } from \"tsyringe\";", "import { Job } from \"bullmq\";", "import { BaseWorker } from \"../baseWorker.js\";", "import { MAIL_QUEUE_NAME, MailJobName } from \"./mailQueue.js\";", "import { MailService } from \"../../modules/mail/mailService.js\";", "import { SendOtpEmailParams } from \"../../modules/mail/mailTypes.js\";", "", "@injectable()", "export class MailWorker extends BaseWorker<SendOtpEmailParams, { success: boolean }> {", "  constructor(private mailService: MailService) {", "    super(MAIL_QUEUE_NAME, 5);", "  }", "", "  /**", "   * Xử lý từng job gửi email trong hàng đợi", "   */", "  protected async handleJob(", "    job: Job<SendOtpEmailParams>,", "  ): Promise<{ success: boolean }> {", "    if (job.name === MailJobName.SEND_OTP) {", "      const data = job.data;", "      const success = await this.mailService.sendOtpEmail(data);", "      if (!success) {", "        throw new Error(`Failed to send OTP email to ${data.to}`);", "      }", "      return { success: true };", "    }", "", "    return { success: false };", "  }", "}", ""]}, "MS": {"path": "_backend/src/modules/mail/mailService.ts", "lang": "ts", "lines": ["import { injectable } from \"tsyringe\";", "import nodemailer, { type Transporter } from \"nodemailer\";", "import { SendEmailOptions, SendOtpEmailParams } from \"./mailTypes.js\";", "import { renderOtpEmailTemplate } from \"./mailTemplates.js\";", "import { t } from \"../../utils/i18n.js\";", "import { OTP_EXPIRES_IN_MINUTES } from \"../../utils/constanst.js\";", "", "@injectable()", "export class MailService {", "  private transporter: Transporter | null = null;", "  private fromEmail: string;", "", "  constructor() {", "    const user = process.env.SMTP_USER;", "    const pass = process.env.SMTP_PASS;", "    const host = process.env.SMTP_HOST || \"smtp.gmail.com\";", "    const port = Number(process.env.SMTP_PORT) || 465;", "    const secure = process.env.SMTP_SECURE === \"true\" || port === 465;", "", "    this.fromEmail =", "      process.env.MAIL_FROM ||", "      (user ? `Roomee <${user}>` : \"Roomee <no-reply@roomee.vn>\");", "", "    if (user && pass) {", "      this.transporter = nodemailer.createTransport({", "        host,", "        port,", "        secure,", "        auth: {", "          user,", "          pass,", "        },", "      });", "    }", "  }", "", "  /**", "   * Gửi email qua Gmail SMTP (hoặc fallback in log console nếu chưa cấu hình tài khoản Gmail)", "   */", "  public async sendMail(", "    options: SendEmailOptions,", "  ): Promise<{ id?: string; success: boolean }> {", ext,", "            t('resetPasswordSuccessMessage'),", "          );", "          context.go(AppRoutes.wrapper);", "        } else if (state is AuthResetPasswordSuccess) {", "          AppNotification.showSuccess(", "            context,", "            t('resetPasswordSuccessMessage'),", "          );", "          context.go(AppRoutes.wrapper);", "        } else if (state is AuthFailure) {", "          AppNotification.showError(context, state.message);", "        }", "      },", "      builder: (context, state) {", "        final isLoading = state is AuthLoading;", "", "        return LoadingOverlay(", "          isLoading: isLoading,", "          child: Scaffold(", "            backgroundColor: DefaultColors.white,", "            appBar: AppBar(", "              backgroundColor: DefaultColors.white,", "              elevation: 0,", "              leading: IconButton(", "                icon: const Icon(", "                  Icons.arrow_back_ios_new,", "                  color: DefaultColors.primary,", "                  size: 20,", "                ),", "                onPressed: () {", "                  if (context.canPop()) {", "                    context.pop();", "                  } else {", "                    context.go(AppRoutes.login);", "                  }", "                },", "              ),", "            ),", "            body: SafeArea(", "              child: SingleChildScrollView(", "                padding: const EdgeInsets.symmetric(", "                  horizontal: 24,", "                  vertical: 8,", "                ),", "                child: Form(", "                  key: _formKey,", "                  autovalidateMode: _autovalidateMode,", "                  child: Column(", "                    crossAxisAlignment: CrossAxisAlignment.stretch,", "                    children: [", "                      const SizedBox(height: 12),", "                      Center(", "                        child: Image.asset(", " AuthState> emit,", "  ) async {", "    try {", "      final isLoggedIn = await _authRepository.isLoggedIn();", "      if (isLoggedIn) {", "        // 1. Stale-While-Revalidate: Đọc ngay cache cũ từ storage để UI hiển thị tức thì (0ms latency)", "        final cachedUser = await _authRepository.getCurrentUser();", "        final token = await _authRepository.getToken() ?? '';", "        final refreshToken = await _authRepository.getRefreshToken();", "        _networkSentinel.triggerSync(force: true);", "        emit(", "          Authenticated(", "            user: cachedUser,", "            token: token,", "            refreshToken: refreshToken,", "          ),", "        );", "", "        // 2. Làm tươi dữ liệu từ server (Revalidation qua GET /auth/me)", "        try {", "          final freshUser = await _authRepository.syncUserProfile();", "          if (freshUser != null) {", "            final latestToken = await _authRepository.getToken() ?? token;", "            final latestRefreshToken =", "                await _authRepository.getRefreshToken() ?? refreshToken;", "            emit(", "              Authenticated(", "                user: freshUser,", "                token: latestToken,", "                refreshToken: latestRefreshToken,", "              ),", "            );", "          }", "        } on UnauthorizedException {", "          emit(const Unauthenticated());", "        } on ForbiddenException {", "          emit(const Unauthenticated());", "        } catch (_) {", "          // Lỗi mạng hoặc server tạm thời: Giữ nguyên cachedUser để người dùng sử dụng tiếp (hỗ trợ offline)", "        }", "      } else {", "        emit(const Unauthenticated());", "      }", "    } catch (_) {", "      emit(const Unauthenticated());", "    }", "  }", "", "  Future<void> _onAuthLogin(", "    AuthLoginEvent event,", "    Emitter<AuthState> emit,", "  ) async {", "    emit(const AuthLoading());", "    try {", "      final authData = await _authRepository.login(event.request);", "      if (authData.code == AuthOtpRequired.needVerifyEmail) {", "        emit(", "          AuthOtpRequired(", "            destination: event.request.email,", "            purpose: 'register',", "            user: authData.user,", "          ),", "        );", "      } else {", "        _networkSentinel.triggerSync(force: true);", "        emit(", "          Authenticated(", "            user: authData.user,", "            token: authData.token,", "            refreshToken: authData.refreshToken,", "          ),", "        );", "      }", "    } on ApiException catch (e) {", "      emit(", "        AuthFailure(", "          message: e.message,", "          statusCode: e.statusCode,", "          errors: e.errors,", "        ),", "      );", "    } catch (e) {", "      emit(AuthFailure(message: e.toString()));", "    }", "  }", "", "  Future<void> _onAuthRegister(", "    AuthRegisterEvent event,", "    Emitter<AuthState> emit,", "  ) async {", "    emit(const AuthLoading());", "    try {", "      final authData = await _authRepository.register(event.request);", "      if (authData.code == AuthOtpRequired.needVerifyEmail) {", "        emit(", "          AuthOtpRequired(", "            destination: event.request.email,", "            purpose: 'register',", "            user: authData.user,", "          ),", "        );", "      } else {", "        emit(const Unauthenticated());", "      }", "    } on ApiException catch (e) {", "      emit(", "        AuthFailure(", "          message: e.message,", "          statusCode: e.statusCode,", "          errors: e.errors,", "        ),", "      );", "    } catch (e) {", "      emit(AuthFailure(message: e.toString()));", "    }", "  }", "", "  Future<void> _onAuthLogout(", "    AuthLogoutEvent event,", "    Emitter<AuthState> emit,", "  ) async {", "    emit(const AuthLoading());", "    try {", "      await _authRepository.logout(", "        preservePendingChanges: event.preservePendingChanges,", "      );", "    } finally {", "      emit(const Unauthenticated());", "    }", "  }", "", "  Future<void> _onAuthVerifyOtp(", "    AuthVerifyOtpEvent event,", "    Emitter<AuthState> emit,", "  ) async {", "    emit(const AuthLoading());", "    try {", "      final authData = await _authRepository.verifyOtp(", "        email: event.email,", "        otp: event.otp,", "      );", "      _networkSentinel.triggerSync(force: true);", "      emit(", "        Authenticated(", "          user: authData.user,", "          token: authData.token,", "          refreshToken: authData.refreshToken,", "        ),", "      );", "    } on ApiException catch (e) {", "      emit(", "        AuthFailure(", "          message: e.message,", "          statusCode: e.statusCode,", "          errors: e.errors,", "        ),", "      );", "    } catch (e) {", "      emit(AuthFailure(message: e.toString()));", "    }", "  }", "", "  Future<void> _onAuthResendOtp(", "    AuthResendOtpEvent event,", "    Emitter<AuthState> emit,", "  ) async {", "    emit(const AuthLoading());", "    try {", "      await _authRepository.resendOtp(event.email);", "      emit(const AuthOtpSent());", "    } on ApiException catch (e) {", "      emit(", "        AuthFailure(", "          message: e.message,", "          statusCode: e.statusCode,", "          errors: e.errors,", "        ),", "      );", "    } catch (e) {", "      emit(AuthFailure(message: e.toString()));", "    }", "  }", "", "  Future<void> _onAuthForgotPassword(", "    AuthForgotPasswordEvent event,", "    Emitter<AuthState> emit,", "  ) async {", "    emit(const AuthLoading());", "    try {", "      await _authRepository.forgotPassword(event.email);", "      emit(AuthForgotPasswordSent(email: event.email));", "    } on ApiException catch (e) {", "      emit(", "        AuthFailure(", "          message: e.message,", "          statusCode: e.statusCode,", "          errors: e.errors,", "        ),", "      );", "    } catch (e) {", "      emit(AuthFailure(message: e.toString()));", "    }", "  }", "", "  Future<void> _onAuthVerifyResetOtp(", "    AuthVerifyResetOtpEvent event,", "    Emitter<AuthState> emit,", "  ) async {", "    emit(const AuthLoading());", "    try {", "      final resetToken = await _authRepository.verifyResetOtp(", "        email: event.email,", "        otp: event.otp,", "      );", "      emit(AuthResetOtpVerified(email: event.email, resetToken: resetToken));", "    } on ApiException catch (e) {", "      emit(", "        AuthFailure(", "          message: e.message,", "          statusCode: e.statusCode,", "          errors: e.errors,", "        ),", "      );", "    } catch (e) {", "      emit(AuthFailure(message: e.toString()));", "    }", "  }", "", "  Future<void> _onAuthResetPassword(", "    AuthResetPasswordEvent event,", "    Emitter<AuthState> emit,", "  ) async {", "    emit(const AuthLoading());", "    try {", "      final authData = await _authRepository.resetPassword(", "        resetToken: event.resetToken,", "        newPassword: event.newPassword,", "      );", "      _networkSentinel.triggerSync(force: true);", "      emit(", "        Authenticated(", "          user: authData.user,", "          token: authData.token,", "          refreshToken: authData.refreshToken,", "        ),", "      );", "    } on ApiException catch (e) {", "      emit(", "        AuthFailure(", "          message: e.message,", "          statusCode: e.statusCode,", "          errors: e.errors,", "        ),", "      );", "    } catch (e) {", "      emit(AuthFailure(message: e.toString()));", "    }", "  }", "}", ""]}, "FREPO": {"path": "lib/features/auth/data/auth_repository.dart", "lang": "dart", "lines": ["import 'package:roomee/core/localization/app_localizations.dart';", "import 'package:roomee/core/models/models.dart';", "import 'package:roomee/core/network/api_exceptions.dart';", "import 'package:roomee/core/offline/hive/cache_boxes.dart';", "import 'package:roomee/features/auth/data/auth_dto.dart';", "import 'package:roomee/features/auth/data/auth_local_datasource.dart';", "import 'package:roomee/features/auth/data/auth_remote_datasource.dart';", "", "abstract class IAuthRepository {", "  Future<AuthData> login(LoginRequest request);", "", "  Future<AuthData> register(RegisterRequest request);", "", "  Future<void> resendOtp(String email);", "  Future<AuthData> verifyOtp({required String email, required String otp});", "", "  Future<void> forgotPassword(String email);", "  Future<String> verifyResetOtp({required String email, required String otp});", "  Future<AuthData> resetPassword({", "    required String resetToken,", "    required String newPassword,", "  });", "", "  Future<UserModel?> getCurrentUser();", "  Future<UserModel?> syncUserProfile();", "  Future<bool> isLoggedIn();", "  Future<String?> getToken();", "  Future<String?> getRefreshToken();", "  Future<RefreshTokenResponse> refreshToken();", "  Future<void> logout({bool preservePendingChanges = false});", "}", "", "class AuthRepository implements IAuthRepository {", "  final AuthRemoteDataSource _remoteDataSource;", "  final AuthLocalDataSource _localDataSource;", "  final CacheBoxes? cacheBoxes;", "", "  AuthRepository({", "    AuthRemoteDataSource? remoteDataSource,", "    AuthLocalDataSource? localDataSource,", "    this.cacheBoxes,", "  })  : _remoteDataSource = remoteDataSource ?? AuthRemoteDataSource(),", "        _localDataSource = localDataSource ?? AuthLocalDataSource();", "", "  Future<void> _saveAuthSession(AuthData authData) async {", "    if (authData.token.isNotEmpty) {", "      await _localDataSource.saveToken(authData.token);", "    }", "    if (authData.refreshToken != null && authData.refreshToken!.isNotEmpty) {", "      await _localDataSource.saveRefreshToken(authData.refreshToken!);", "    }", "    if (authData.user != null) {", "      await _localDataSource.saveUser(authData.user!);", "    }", "  }", "", "  @override", "  Future<AuthData> login(LoginRequest request) async {", "    final response = await _remoteDataSource.login(request);", "", "    final authData = response.data;", "    if (authData == null) {", "      throw ServerException(message: t('errors.invalidServerResponse'));", "    }", "", "    await _saveAuthSession(authData);", "", "    return authData;", "  }", "", "  @override", "  Future<AuthData> register(RegisterRequest request) async {", "    final response = await _remoteDataSource.register(request);", "", "    final authData = response.data;", "    if (authData == null) {", "      throw ServerException(message: t('errors.invalidServerResponse'));", "    }", "", "    await _saveAuthSession(authData);", "", "    return authData;", "  }", "", "  @override", "  Future<void> resendOtp(String email) async {", "    await _remoteDataSource.resendOtp(email);", "  }", "", "  @override", "  Future<AuthData> verifyOtp({", "    required String email,", "    required String otp,", "  }) async {", "    final response = await _remoteDataSource.verifyOtp(email: email, otp: otp);", "    final authData = response.data;", "    if (authData == null) {", "      throw ServerException(message: t('errors.invalidServerResponse'));", "    }", "", "    await _saveAuthSession(authData);", "", "    return authData;", "  }", "", "  @override", "  Future<void> forgotPassword(String email) async {", "    await _remoteDataSource.forgotPassword(email);", "  }", "", "  @override", "  Future<String> verifyResetOtp({", "    required String email,", "    required String otp,", "  }) async {", "    final response = await _remoteDataSource.verifyResetOtp(", "      email: email,", "      otp: otp,", "    );", "    final token = response.data?.resetToken;", "    if (token == null || token.isEmpty) {", "      throw const ServerException(message: 'Mã xác thực không hợp lệ');", "    }", "    return token;", "  }", "", "  @override", "  Future<AuthData> resetPassword({", "    required String resetToken,", "    required String newPassword,", "  }) async {", "    f s String?;", "        newRefreshToken = payload['refreshToken'] as String?;", "      }", "", "      if (newAccessToken == null || newAccessToken.isEmpty) {", "        throw const FormatException('Invalid refresh response');", "      }", "", "      await _storage.write(key: tokenKey, value: newAccessToken);", "      if (newRefreshToken != null && newRefreshToken.isNotEmpty) {", "        await _storage.write(key: refreshTokenKey, value: newRefreshToken);", "      }", "", "      _cancelInactivityTimer();", "", "      final queueToRetry = List<_RetryQueueItem>.from(_retryQueue);", "      _retryQueue.clear();", "      _isRefreshing = false;", "", "      for (final item in queueToRetry) {", "        try {", "          final options = item.options;", "          options.headers['Authorization'] = 'Bearer $newAccessToken';", "          options.extra['retried'] = true;", "          final dioInstance = clientDio ?? _refreshDio;", "          final retryResponse = await dioInstance.fetch(options);", "          item.handler.resolve(retryResponse);", "        } catch (retryErr) {", "          if (retryErr is DioException) {", "            item.handler.reject(retryErr);", "          } else {", "            item.handler.reject(", "              DioException(", "                requestOptions: item.options,", "                error: retryErr,", "              ),", "            );", "          }", "        }", "      }", "", "      onNetworkRestored?.call();", "      return true;", "    } catch (e) {", "      _isRefreshing = false;", "      if (e is DioException) {", "        final status = e.response?.statusCode;", "        if (status == 401 || status == 403) {", "          _cancelInactivityTimer();", "          _rejectAndClearQueue(e);", "          onUnauthorized?.call();", "          return false;", "        }", "      } else if (e is FormatException) {", "        _cancelInactivityTimer();", "        _rejectAndClearQueue(", "          DioException(", "            requestOptions: RequestOptions(path: '/auth/refresh-token'),", "            error: e,", "          ),", "        );", "        onUnauthorized?.call();", "        return false;", "      }", "      // Vẫn là lỗi môi trường: giữ nguyên queue", "      return false;", "    }", "  }", "", "  /// Xóa sạch hàng đợi và reject các request (giải phóng bộ nhớ khi quá 10 phút hoặc hủy)", "  void clearAndRejectQueue([DioException? error]) {", "    _cancelInactivityTimer();", "    _isRefreshing = false;", "    final queue = List<_RetryQueueItem>.from(_retryQueue);", "    _retryQueue.clear();", "    final errToPass = error ??", "        DioException(", "          requestOptions: RequestOptions(path: ''),", "          error: 'Request cancelled after inactivity timeout',", "          type: DioExceptionType.cancel,", "        );", "    for (final item in queue) {", "      item.handler.reject(errToPass);", "    }", "  }", "", "  void _resetInactivityTimer() {", "    _inactivityTimer?.cancel();", "    _inactivityTimer = Timer(inactivityTimeout, () {", "      clearAndRejectQueue(", "        DioException(", "          requestOptions: RequestOptions(path: ''),", "          error: 'Network request queue timed out after 10 minutes of inactivity',", "          type: DioExceptionType.connectionTimeout,", "        ),", "      );", "    });", "  }", "", "  void _cancelInactivityTimer() {", "    _inactivityTimer?.cancel();", "    _inactivityTimer = null;", "  }", "", "  void _rejectAndClearQueue(DioException err) {", "    _isRefreshing = false;", "    final queue = List<_RetryQueueItem>.from(_retryQueue);", "    _retryQueue.clear();", "    for (final item in queue) {", "      item.handler.reject(err);", "    }", "  }", "}", ""]}, "FBASE": {"path": "lib/core/services/baseService.dart", "lang": "dart", "lines": ["// ignore_for_file: file_names", "", "import 'package:dio/dio.dart';", "import 'package:roomee/core/network/api_client.dart';", "import 'package:roomee/core/network/api_exceptions.dart';", "import 'package:roomee/core/network/api_response.dart';", "", "/// Lớp Service cơ sở cung cấp các phương thức gọi HTTP chuẩn hóa (GET, POST, PUT, PATCH, DELETE)", "/// và các hàm CRUD nghiệp vụ mức cao (getDataAll, getDataById, getDataSelect, postData, postDataWithFile, putData, patchData, deleteData).", "///", "/// Các feature service hoặc RemoteDataSource sẽ kế thừa lớp này để tương tác với Backend API.", "class BaseService {", "  final ApiClient client;", "", "  BaseService({ApiClient? client}) : client = client ?? ApiClient.instance;", "", "  Dio get dio => client.dio;", "", "  String _buildPathWithId(String endpoint, dynamic id) {", "    if (id == null) return endpoint;", "    final cleanEndpoint = endpoint.endsWith('/')", "        ? endpoint.substring(0, endpoint.length - 1)", "        : endpoint;", "    return '$cleanEndpoint/$id';", "  }", "", "  /// Helper xử lý response đồng nhất", "  ApiResponse<T> handleResponse<T>(", "    Response response,", "    T Function(dynamic json)? fromJsonT,", "  ) {", "    final responseData = response.data;", "    if (responseData is Map<String, dynamic>) {", "      return ApiResponse<T>.fromJson(responseData, fromJsonT);", "    }", "", "    return ApiResponse<T>(", "      success:", "          (response.statusCode ?? 0) >= 200 && (response.statusCode ?? 0) < 300,", "      message: response.statusMessage ?? '',", "      data: responseData is T ? responseData : null,", "    );", "  }", "", "  /// Wrapper bọc thực thi request và map DioException sang ApiException", "  Future<ApiResponse<T>> safeRequest<T>(", "    Future<Response> Function() request, {", "    T Function(dynamic json)? fromJsonT,", "  }) async {", "    try {", "      final response = await request();", "      return handleResponse<T>(response, fromJsonT);", "    } on DioException catch (e) {", "      throw ApiException.fromDioException(e);", "    } catch (e) {", "      if (e is ApiException) rethrow;", "      throw UnexpectedException(message: e.toString());", "    }", "  }", "", "  // ==========================================", "  // Core HTTP Methods", "  // ==========================================", "", "  /// GET request nguyên bản", "  Future<ApiResponse<T>> get<T>(", "    String path, {", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return safeRequest<T>(", "      () => dio.get(", "        path,", "        queryParameters: queryParameters,", "        options: options,", "        cancelToken: cancelToken,", "      ),", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// POST request nguyên bản", "  Future<ApiResponse<T>> post<T>(", "    String path, {", "    dynamic data,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return safeRequest<T>(", "      () => dio.post(", "        path,", "        data: data,", "        queryParameters: queryParameters,", "        options: options,", "        cancelToken: cancelToken,", "      ),", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// PUT request nguyên bản", "  Future<ApiResponse<T>> put<T>(", "    String path, {", "    dynamic data,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return safeRequest<T>(", "      () => dio.put(", "        path,", "        data: data,", "        queryParameters: queryParameters,", "        options: options,", "        cancelToken: cancelToken,", "      ),", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// PATCH request nguyên bản", "  Future<ApiResponse<T>> patch<T>(", "    String path, {", "    dynamic data,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return safeRequest<T>(", "      () => dio.patch(", "        path,", "        data: data,", "        queryParameters: queryParameters,", "        options: options,", "        cancelToken: cancelToken,", "      ),", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// DELETE request nguyên bản", "  Future<ApiResponse<T>> delete<T>(", "    String path, {", "    dynamic data,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return safeRequest<T>(", "      () => dio.delete(", "        path,", "        data: data,", "        queryParameters: queryParameters,", "        options: options,", "        cancelToken: cancelToken,", "      ),", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  // ==========================================", "  // High-Level Standard CRUD Methods", "  // ==========================================", "", "  /// Lấy toàn bộ danh sách dữ liệu (hỗ trợ query params: phân trang, tìm kiếm, lọc)", "  Future<ApiResponse<T>> getDataAll<T>(", "    String endpoint, {", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return get<T>(", "      endpoint,", "      queryParameters: queryParameters,", "      options: options,", "      cancelToken: cancelToken,", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// Lấy chi tiết một bản ghi theo ID (tự động nối endpoint/id)", "  Future<ApiResponse<T>> getDataById<T>(", "    String endpoint,", "    dynamic id, {", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    final path = _buildPathWithId(endpoint, id);", "    return get<T>(", "      path,", "      queryParameters: queryParameters,", "      options: options,", "      cancelToken: cancelToken,", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// Lấy danh sách rút gọn phục vụ hiển thị combobox, dropdown, thẻ chọn", "  Future<ApiResponse<T>> getDataSelect<T>(", "    String endpoint, {", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return get<T>(", "      endpoint,", "      queryParameters: queryParameters,", "      options: options,", "      cancelToken: cancelToken,", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// Thêm mới bản ghi (POST)", "  Future<ApiResponse<T>> postData<T>(", "    String endpoint, {", "    dynamic data,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return post<T>(", "      endpoint,", "      data: data,", "      queryParameters: queryParameters,", "      options: options,", "      cancelToken: cancelToken,", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// Thêm mới bản ghi kèm tệp tin (Multipart / FormData upload với progress callback)", "  Future<ApiResponse<T>> postDataWithFile<T>(", "    String endpoint, {", "    required FormData formData,", "    ProgressCallback? onSendProgress,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    return safeRequest<T>(", "      () => dio.post(", "        endpoint,", "        data: formData,", "        queryParameters: queryParameters,", "        options: options,", "        cancelToken: cancelToken,", "        onSendProgress: onSendProgress,", "      ),", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// Cập nhật toàn bộ bản ghi (PUT) (có thể truyền id riêng hoặc gom sẵn trong endpoint)", "  Future<ApiResponse<T>> putData<T>(", "    String endpoint, {", "    dynamic id,", "    dynamic data,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    final path = _buildPathWithId(endpoint, id);", "    return put<T>(", "      path,", "      data: data,", "      queryParameters: queryParameters,", "      options: options,", "      cancelToken: cancelToken,", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// Cập nhật một phần bản ghi (PATCH) (có thể truyền id riêng hoặc gom sẵn trong endpoint)", "  Future<ApiResponse<T>> patchData<T>(", "    String endpoint, {", "    dynamic id,", "    dynamic data,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    final path = _buildPathWithId(endpoint, id);", "    return patch<T>(", "      path,", "      data: data,", "      queryParameters: queryParameters,", "      options: options,", "      cancelToken: cancelToken,", "      fromJsonT: fromJsonT,", "    );", "  }", "", "  /// Xóa bản ghi (DELETE) (có thể truyền id riêng hoặc gom sẵn trong endpoint)", "  Future<ApiResponse<T>> deleteData<T>(", "    String endpoint, {", "    dynamic id,", "    dynamic data,", "    Map<String, dynamic>? queryParameters,", "    Options? options,", "    CancelToken? cancelToken,", "    T Function(dynamic json)? fromJsonT,", "  }) {", "    final path = _buildPathWithId(endpoint, id);", "    return delete<T>(", "      path,", "      data: data,", "      queryParameters: queryParameters,", "      options: options,", "      cancelToken: cancelToken,", "      fromJsonT: fromJsonT,", "    );", "  }", "}", ""]}, "FEXC": {"path": "lib/core/network/api_exceptions.dart", "lang": "dart", "lines": ["import 'dart:io';", "import 'package:dio/dio.dart';", "import 'package:roomee/core/localization/app_localizations.dart';", "", "abstract class ApiException implements Exception {", "  final String? rawMessage;", "  final int? statusCode;", "  final dynamic errors;", "", "  const ApiException({", "    String? message,", "    this.statusCode,", "    this.errors,", "  }) : rawMessage = message;", "", "  String get defaultMessage => t('errors.unexpected');", "", "  String get message => rawMessage ?? defaultMessage;", "", "  @override", "  String toString() => '$runtimeType: $message (statusCode: $statusCode)';", "", "  factory ApiException.fromDioException(DioException dioException) {", "    switch (dioException.type) {", "      case DioExceptionType.connectionTimeout:", "      case DioExceptionType.sendTimeout:", "      case DioExceptionType.receiveTimeout:", "        return TimeoutException(", "          message: t('errors.connectionTimeout'),", "        );", "", "      case DioExceptionType.connectionError:", "        return const NoInternetException();", "", "      case DioExceptionType.badResponse:", "        final response = dioException.response;", "        final statusCode = response?.statusCode;", "        String? message;", "        dynamic errors;", "", "        if (response?.data is Map<String, dynamic>) {", "          final data = response!.data as Map<String, dynamic>;", "          if (data['message'] is String && (data['message'] as String).isNotEmpty) {", "            message = data['message'] as String;", "          }", "          errors = data['errors'];", "        } else if (response?.statusMessage != null && response!.statusMessage!.isNotEmpty) {", "          message = response.statusMessage!;", "        }", "", "        switch (statusCode) {", "          case 400:", "          case 422:", "            return ClientException(", "              message: message,", "              statusCode: statusCode,", "              errors: errors,", "            );", "          case 401:", "            return UnauthorizedException(", "              message: message,", "              statusCode: 401,", "              errors: errors,", "            );", "          case 403:", "            return ForbiddenException(", "              message: message,", "              statusCode: 403,", "              errors: errors,", "            );", "          case 404:", "            return NotFoundException(", "              message: message,", "              statusCode: 404,", "              errors: errors,", "            );", "          case 500:", "          case 502:", "          case 503:", "          case 504:", "            return ServerException(", "              message: message,", "              statusCode: statusCode,", "              errors: errors,", "            );", "          default:", "            return ClientException(", "              message: message,", "              statusCode: statusCode ?? 400,", "              errors: errors,", "            );", "        }", "", "      case DioExceptionType.cancel:", "        return UnexpectedException(", "          message: t('errors.requestCancelled'),", "        );", "", "      case DioExceptionType.badCertificate:", "        return UnexpectedException(", "          message: t('errors.badCertificate'),", "        );", "", "      case DioExceptionType.unknown:", "      default:", "        if (dioException.error is SocketException) {", "          return const NoInternetException();", "        }", "        return UnexpectedException(", "          message: dioException.message,", "        );", "    }", "  }", "}", "", "/// Khi không có kết nối Internet hoặc DNS/mạng lỗi (Offline mode trigger)", "class NoInternetException extends ApiException {", "  const NoInternetException({", "    super.message,", "    super.statusCode,", "    super.errors,", "  });", "", "  @override", "  String get defaultMessage => t('errors.noInternet');", "}", "", "/// Khi request bị timeout (connect, send, receive)", "class TimeoutException extends ApiException {", "  const TimeoutException({", "    super.message,", "    super.statusCode,", "    super.errors,", "  });", "", "  @override", "  String get defaultMessage => t('errors.timeout');", "}", "", "/// Lỗi 401 Unauthorized (Token hết hạn port 'package:roomee/core/screens/loading_screen.dart';", "import 'package:roomee/core/widgets/app_confirm_dialog.dart';", "import 'package:roomee/features/auth/presentation/bloc/auth_bloc.dart';", "import 'package:roomee/features/workspace/presentation/bloc/workspace_bloc.dart';", "", "/// Đăng xuất thủ công, không để mất các thay đổi ngoại tuyến chưa gửi.", "///", "/// - Không còn phiếu chờ: đăng xuất ngay.", "/// - Còn phiếu: thử đẩy lên server trước; thành công thì đăng xuất bình thường.", "/// - Đẩy thất bại: hỏi người dùng giữ lại (gửi tiếp khi đăng nhập lại) hay xoá.", "Future<void> confirmAndLogout(BuildContext context) async {", "  final authBloc = context.read<AuthBloc>();", "  final workspaceBloc = context.read<WorkspaceBloc?>();", "", "  final pending = await workspaceBloc?.pendingMutationCount() ?? 0;", "  if (pending == 0) {", "    authBloc.add(const AuthLogoutEvent());", "    return;", "  }", "", "  if (!context.mounted) return;", "  LoadingScreen.show(context);", "  await workspaceBloc!.flushPendingMutations();", "  final remaining = await workspaceBloc.pendingMutationCount();", "", "  if (!context.mounted) return;", "  LoadingScreen.hide(context);", "", "  if (remaining == 0) {", "    authBloc.add(const AuthLogoutEvent());", "    return;", "  }", "", "  if (!context.mounted) return;", "  final keep = await AppConfirmDialog.show(", "    context,", "    title: t('logoutPendingTitle'),", "    message: t('logoutPendingMessage', {'count': '$remaining'}),", "    cancelText: t('logoutDiscard'),", "    confirmText: t('logoutKeepPending'),", "    barrierDismissible: false,", "  );", "", "  if (keep == null) return;", "  authBloc.add(AuthLogoutEvent(preservePendingChanges: keep));", "}", ""]}, "FMAIN": {"path": "lib/main.dart", "lang": "dart", "lines": ["import 'dart:async';", "", "import 'package:flutter/material.dart';", "import 'package:flutter_bloc/flutter_bloc.dart';", "import 'package:flutter_localizations/flutter_localizations.dart';", "import 'package  ).purgeExpired(maxAge: syncMutationTtl),", "  );", "", "  final authRepository = AuthRepository(cacheBoxes: cacheBoxes);", "  final authBloc = AuthBloc(authRepository: authRepository)", "    ..add(const AuthCheckEvent());", "", "  // Hook tự động đăng xuất khi gặp lỗi 401 Unauthorized từ bất kỳ API nào,", "  // và hiển thị màn hình NoInternetScreen khi mất mạng mà không bị đăng xuất", "  ApiClient(", "    onUnauthorized: () {", "      // Hết phiên tự động: giữ lại sổ phiếu để gửi tiếp khi đăng nhập lại", "      authBloc.add(const AuthLogoutEvent(preservePendingChanges: true));", "    },", "    onNetworkError: () {", "      final context = rootNavigatorKey.currentContext;", "      if (context != null) {", "        NoInternetScreen.show(context);", "      }", "    },", "  );", "", "  // Khởi động Lính canh mạng (Network Sentinel) lắng nghe trạng thái kết nối thời gian thực", "  final sentinel = NetworkSentinel.instance..initialize();", "  sentinel.statusNotifier.addListener(() {", "    if (sentinel.isOnline && NoInternetScreen.isShowing) {", "      final context = rootNavigatorKey.currentContext;", "      if (context != null) {", "        NoInternetScreen.hide(context);", "      }", "    }", "  });", "", "  runApp(", "    MyApp(", "      initialLocale: initialLocale,", "      authBloc: authBloc,", "      cacheBoxes: cacheBoxes,", "    ),", "  );", "}", "", "class MyApp extends StatefulWidget {", "  final Locale initialLocale;", "  final GoRouter? router;", "  final AuthBloc? authBloc;", "  final GeneralBloc? generalBloc;", "  final WorkspaceBloc? workspaceBloc;", "  final CacheBoxes? cacheBoxes;", "", "  const MyApp({", "    super.key,", "    this.initialLocale = const Locale('vi'),", "    this.router,", "    this.authBloc,", "    this.generalBloc,", "    this.workspaceBloc,", "    this.cacheBoxes,", "  });", "", "  @override", "  State<MyApp> createState() => _MyAppState();", "}", "", "class _MyAppState extends State<MyApp> with WidgetsBindingObserver {", "  late final AuthBloc _authBloc;", "", "  @override", "  void initState() {", "    super.initState();", "    WidgetsBinding.instance.addObserver(this);", "    _authBloc = widget.authBloc ?? (AuthBloc()..add(const AuthCheckEvent()));", "  }", "", "  @override", "  void dispose() {", "    WidgetsBinding.instance.removeObserver(this);", "    super.dispose();", "  }", "", "  @override", "  void didChangeAppLifecycleState(AppLifecycleState state) {", "    if (state == AppLifecycleState.resumed) {", "      // Khi ứng dụng chuyển từ Background lên Foreground:", "      // Tự động kích hoạt AuthCheckEvent() để làm mới thông tin mới nhất từ server", "      _authBloc.add(const AuthCheckEvent());", "    }", "  }", "", "  @override", "  Widget build(BuildContext context) {", "    final app = MultiBlocProvider(", "      providers: [", "        BlocProvider(", "          create: (_) => LocaleCubit(initialLocale: widget.initialLocale),", "        ),", "        if (widget.generalBloc != null)", "          BlocProvider.value(value: widget.generalBloc!)", "        else", "          BlocProvider(", "            lazy: false,", "            create: (_) => GeneralBloc(", "              repository: widget.cacheBoxes != null", "                  ? GeneralRepository.fromBoxes(widget.cacheBoxes!)", "                  : GeneralRepository(),", "            )..add(const GeneralProvincesLoadEvent()),", "          ),", "        BlocProvider.value(value: _authBloc),", "      ],", "      child: BlocBuilder<AuthBloc, AuthState>(", "        buildWhen: (prev, curr) {", "          final prevUserId = prev is Authenticated ? prev.user?.id : null;", "          final currUserId = curr is Authenticated ? curr.user?.id : null;", "          return prevUserId != currUserId;", "        },", "        builder: (context, authState) {", "          final sessionKey = authState is Authenticated", "              ? (authState.user?.id ?? 'authenticated')", "              : 'guest';", "", "          return MultiBlocProvider(", "
