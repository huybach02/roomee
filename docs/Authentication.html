30:00", "isRevoked": true}, {"id": "1f7c6e83-9b2a-4d15-8c3e-6a71d0b5f303", "tokenHash": "255e9afe…34f8", "previousTokenHash": null, "ipAddress": "113.161.42.7", "expiresAt": "22/11 21:05:00", "isRevoked": true}], "kv": [{"key": "blacklist:session:1f7c6e83-9b2a-4d15-8c3e-6a71d0b5f303", "value": "1", "exp": "21:20:00"}]}}, "flows": [{"id": "register", "no": "1", "short": "Đăng ký", "title": "Đăng ký tài khoản", "endpoint": "POST /api/v1/auth/register", "summary": "Tạo dòng mới trong `users` với `isEmailVerified=false`, sinh OTP 6 số lưu 10 phút, xếp email vào hàng đợi và trả `code: NEED_VERIFY_EMAIL`. **Chưa** cấp token: muốn vào app phải qua luồng 2.", "idea": "Làm **thẻ thư viện**: điền phiếu, thư viện ghi tên vào sổ nhưng đánh dấu \"chưa xác nhận địa chỉ\" và gửi một mã qua bưu điện. Chưa phát vòng tay vào cổng.", "details": [{"id": "1.1", "lane": "ui", "title": "Màn Đăng ký — gom form thành RegisterRequest", "sum": "Minh điền form và bấm **Đăng ký**. Màn hình chạy các validator của form, nếu ổn thì đóng gói dữ liệu thành `RegisterRequest` và gửi một sự kiện vào AuthBloc. Màn hình không tự gọi API.", "code": [{"f": "FREG", "a": 67, "b": 92, "n": [[68, 68, "Cụp bàn phím trước khi xử lý."], [69, 69, "Chạy mọi validator của form. Luật phía app (`FieldRules`) chép theo luật backend: email đúng định dạng, mật khẩu ≥ 8 ký tự, số điện thoại Việt Nam…"], [70, 86, "Tạo `RegisterRequest` rồi `add(AuthRegisterEvent)` vào AuthBloc. Email chỉ được `trim()`, **chưa** hạ chữ thường: Minh gõ `Minh.Tran@example.com` thì gửi nguyên như vậy."], [81, 83, "Ngày sinh đổi về chuỗi `yyyy-MM-dd`, đúng định dạng `dateRule` bên server."], [87, 91, "Form sai: bật chế độ tự kiểm tra khi gõ để hiện lỗi đỏ ngay dưới ô. Không có request nào được gửi."]]}, {"f": "FDTO", "a": 49, "b": 62, "n": [[54, 55, "Số điện thoại rỗng thì bỏ hẳn khỏi JSON."], [56, 57, "Enum Dart → chuỗi: `Gender.male` thành `\"male\"`, `UserRole.tenant` thành `\"tenant\"`."], [58, 60, "Tỉnh/phường/ngày sinh chỉ gửi khi có giá trị."]], "text": "`toJson()` là nơi quyết định JSON thật sự bay lên server:"}], "short": "Màn Đăng ký", "ba": {"b": {"form.fullName": "Trần Minh", "form.email": "Minh.Tran@example.com  ", "form.password": "Minh@Roomee26", "form.phone": "0912345678", "form.province": "Hà Nội", "form.ward": "Ba Đình", "form.dob": "12/04/2001"}, "a": {"fullName": "Trần Minh", "email": "Minh.Tran@example.com", "password": "Minh@Roomee26", "phoneNumber": "0912345678", "gender": "male", "role": "tenant", "provinceId": 1, "wardId": 1, "birthday": "2001-04-12"}, "bl": "ô nhập trên màn hình", "al": "JSON body sẽ gửi"}, "idea": "Đăng ký giống **làm thẻ thư viện**: điền phiếu ở quầy (màn hình), nhân viên (Bloc) nhận phiếu và chuyển vào trong. Chưa có thẻ ngay, phải chờ thư xác nhận gửi qua bưu điện."}, {"id": "1.2", "lane": "bloc", "title": "AuthBloc — bật Loading rồi gọi repository", "sum": "Bloc là \"bộ não\" của màn hình: nhận sự kiện, gọi tầng dữ liệu và phát ra trạng thái mới cho UI vẽ lại.", "code": [{"f": "FBLOC", "a": 121, "b": 150, "n": [[125, 125, "Phát `AuthLoading` → màn Đăng ký hiện lớp phủ quay vòng (`LoadingOverlay`)."], [127, 127, "Gọi repository và **chờ** (await) kết quả từ server."], [128, 135, "Server trả `code == \"NEED_VERIFY_EMAIL\"` (hằng số ở `auth_state.dart:39`) → phát `AuthOtpRequired` kèm email đích và mục đích `register`."], [136, 138, "Code khác: về `Unauthenticated`. Backend hiện luôn trả `NEED_VERIFY_EMAIL` khi đăng ký thành công nên nhánh này gần như không chạy."], [139, 146, "Server trả lỗi (409, 400, 429…) → `AuthFailure` mang nguyên câu thông báo tiếng Việt của server."]]}], "short": "AuthBloc"}, {"id": "1.3", "lane": "repo", "title": "Repository & Dio — gửi POST /auth/register", "sum": "Repository chọn nguồn dữ liệu (ở đây là server), DataSource gọi HTTP qua Dio, còn AuthInterceptor gắn header trước khi request rời máy.", "code": [{"f": "FREPO", "a": 71, "b": 83, "n": [[73, 73, "Gọi DataSource. Kết quả là `ApiResponse<AuthData>`."], [75, 78, "Server trả 2xx nhưng không có `data` → tự ném `ServerException`."], [80, 80, "Lưu phiên vào bộ nhớ an toàn (xem [[1.15|1.15]]). Với đăng ký, chỉ có user được lưu vì chưa có token."]]}, {"f": "FREM", "a": 23, "b": 29, "n": [[24, 28, "`postData` của BaseService gọi `dio.post('/auth/register')`. `fromJsonT` biến `data` thành `AuthData`."]]}, {"f": "FINT", "a": 65, "b": 89, "n": [[72, 77, "Đọc `access_token` từ SecureStorage. Minh chưa đăng nhập nên không có → **không** gắn `Authorization`."], [80, 83, "Gắn `Accept-Language` (mặc định `vi`) để server trả thông báo đúng ngôn ngữ."], [88, 88, "Cho request đi tiếp ra mạng."]], "lane": "repo"}], "short": "Repository & Dio"}, {"id": "1.4", "lane": "router", "title": "Express — parse body và chọn route", "sum": "Request tới server Node.js. Trước khi vào route, mọi request đều qua vài middleware toàn cục (xem [[N1|N1]]). Router của module auth khai báo thứ tự các lớp kiểm tra.", "code": [{"f": "R", "a": 38, "b": 43, "n": [[39, 39, "Đường dẫn đầy đủ: `/api/v1` + `/auth` + `/register`."], [40, 40, "Lớp 1: giới hạn tần suất theo IP."], [41, 41, "Lớp 2: kiểm tra và làm sạch body bằng Zod."], [42, 42, "Lớp 3: controller. Chỉ chạy khi hai lớp trên gọi `next()`."]]}], "short": "Router"}, {"id": "1.5", "lane": "mw", "title": "Rate limit — tối đa 10 lần đăng ký / 15 phút / IP", "sum": "Chặn một máy spam tạo tài khoản. Bộ đếm do thư viện `express-rate-limit` giữ, khoá theo `req.ip`.", "code": [{"f": "RL", "a": 35, "b": 39, "n": [[37, 37, "Cửa sổ 15 phút."], [38, 38, "Quá 10 request trong cửa sổ → handler ở dòng 24–31 trả 429."]]}], "short": "Rate limit", "br": ["Request thứ 11 trong 15 phút từ cùng IP → **429** `{\"success\":false,\"message\":\"Bạn đã gửi quá nhiều yêu cầu. Vui lòng thử lại sau ít phút.\",\"errors\":null}`. Controller không chạy."]}, {"id": "1.6", "lane": "mw", "title": "Validate — Zod kiểm tra và chuẩn hoá body", "sum": "Đây là chốt chặn dữ liệu bẩn. Sau bước này, controller nhận `req.body` đã sạch: email đã hạ chữ thường, chuỗi đã trim.", "code": [{"f": "SC", "a": 5, "b": 21, "n": [[6, 6, "Email bắt buộc, ≤ 255 ký tự, tự `trim()` + `toLowerCase()` rồi mới kiểm tra định dạng ([[N9|N9]])."], [7, 7, "Mật khẩu 8–255 ký tự, **không** trim (khoảng trắng là một phần mật khẩu)."], [8, 11, "Các trường mô tả đều tuỳ chọn."], [9, 9, "Số điện thoại phải khớp `^(?:\\+84|0)(?:3|5|7|8|9)\\d{8}$`."], [16, 18, "Chỉ cho chọn `landlord` hoặc `tenant`. Gửi `admin` sẽ bị chặn ở đây."]]}, {"f": "VM", "a": 5, "b": 20, "n": [[7, 7, "`safeParse` không ném lỗi, trả `{success, data | error}`."], [9, 15, "Sai → 400 kèm danh sách `{field, message}` cho từng ô."], [17, 17, "Đúng → **ghi đè** `req.body` bằng dữ liệu đã chuẩn hoá."]]}], "short": "Validate", "ba": {"b": {"email": "Minh.Tran@example.com", "password": "Minh@Roomee26", "fullName": "Trần Minh"}, "a": {"email": "minh.tran@example.com", "password": "Minh@Roomee26", "fullName": "Trần Minh"}, "bl": "req.body gốc", "al": "req.body sau Zod"}, "br": ["Mật khẩu 6 ký tự → **400** `{\"message\":\"Dữ liệu gửi lên không hợp lệ.\",\"errors\":[{\"field\":\"password\",\"message\":\"Password must be at least 8 characters\"}]}`.", "Email sai định dạng → `{\"field\":\"email\",\"message\":\"Invalid email address\"}`."]}, {"id": "1.7", "lane": "ctrl", "title": "Controller — chuyển body sạch cho service", "sum": "Controller rất mỏng: lấy dữ liệu, gọi service, gói kết quả thành JSON. Mọi lỗi đều đẩy cho bộ xử lý lỗi chung.", "code": [{"f": "C", "a": 19, "b": 32, "n": [[24, 24, "Ép kiểu `req.body` thành `RegisterDto` (đã được Zod kiểm ở bước trước)."], [27, 27, "Toàn bộ nghiệp vụ nằm ở `AuthService.register`."], [28, 28, "Thành công → HTTP **200** (không phải 201) với `message` = `t(\"common.success\")` = \"Thành công\"."], [29, 31, "Lỗi bất kỳ → `next(error)` → global error handler ở `app.ts` ([[N10|N10]])."]]}], "short": "Controller"}, {"id": "1.8", "lane": "svc", "title": "Service — email này đã có người dùng chưa?", "sum": "Trước khi tạo tài khoản, service tìm trong bảng `users` theo email.", "code": [{"f": "S", "a": 53, "b": 61, "n": [[56, 58, "`findOneBy` sinh câu SQL kiểu `SELECT … FROM users WHERE email = $1 AND \"deletedAt\" IS NULL LIMIT 1`. Bỏ qua dòng đã xoá mềm là hành vi mặc định của TypeORM."], [59, 61, "Có rồi → ném `AppError.conflict` → **409**."]]}], "short": "Kiểm tra trùng email", "br": ["Email đã tồn tại → **409** `{\"success\":false,\"message\":\"Email này đã được sử dụng.\",\"errors\":null}`. App hiện thông báo đỏ."], "nh": ["Email đã đăng ký nhưng **chưa xác thực** vẫn nhận 409, server không gửi lại OTP. Người dùng phải vào Đăng nhập (luồng 4 tự gửi OTP mới) hoặc dùng Quên mật khẩu.", "Hai request đăng ký cùng email chạy song song: cả hai cùng qua dòng 56 vì chưa thấy nhau. Request về sau đụng unique index `users.email` → lỗi DB → **500** \"Đã có lỗi xảy ra từ máy chủ.\" thay vì 409."]}, {"id": "1.9", "lane": "svc", "title": "Service — băm mật khẩu và INSERT vào users", "sum": "Mật khẩu không bao giờ được lưu nguyên văn. Service băm bằng argon2 rồi mới tạo dòng mới.", "code": [{"f": "S", "a": 63, "b": 80, "n": [[63, 63, "`argon2.hash` (thư viện) tạo salt ngẫu nhiên và trả chuỗi dạng `$argon2id$v=19$m=65536,t=3,p=4$<salt>$<hash>`. Xem [[N6|N6]]."], [64, 78, "`create` chỉ dựng object trong RAM, **chưa** ghi DB."], [72, 73, "Không gửi giới tính/vai trò thì mặc định `male` / `tenant`."], [74, 75, "Tài khoản mới: `isEmailVerified=false`, `isActive=true`."], [80, 80, "`save` chạy `INSERT INTO users … RETURNING id, createdAt…`. `id` là UUID do PostgreSQL sinh. `createdBy` để `null` vì request này chưa có người đăng nhập."]]}], "short": "Băm mật khẩu & INSERT", "ba": {"b": {"users": "(chưa có dòng của Minh)"}, "a": {"users": {"id": "7b1e4c2a-5d3f-4a8e-9c61-2f0d8b7e1a54", "email": "minh.tran@example.com", "password": "$argon2id$v=19$m=65536,t=3,p=4$k3Vv…", "isEmailVerified": false, "isActive": true, "role": "tenant"}}, "bl": "bảng users", "al": "bảng users"}, "idea": "Hash là **vân tay của mật khẩu**: từ mật khẩu luôn lấy được đúng vân tay đó, nhưng nhìn vân tay không thể dựng lại mật khẩu."}, {"id": "1.10", "lane": "svc", "title": "Service — tạo OTP 6 số, lưu 10 phút", "sum": "OTP (One-Time Password) là mã dùng một lần để chứng minh Minh thật sự sở hữu hộp thư. Cơ chế tạo/lưu dùng chung, xem [[N4|N4]].", "code": [{"f": "S", "a": 82, "b": 87, "n": [[83, 87, "Mục đích `register`, TTL `TTL_OTP_SECONDS` = 600 giây = 10 phút."]]}, {"f": "O", "a": 36, "b": 51, "n": [[41, 41, "`crypto.randomInt(100000, 1000000)` → số ngẫu nhiên an toàn 6 chữ số, ví dụ `482913`."], [42, 43, "Key Redis: `otp:register:minh.tran@example.com` và key đếm sai `otp:attempts:register:minh.tran@example.com`."], [45, 48, "Song song: ghi OTP (Redis `SET … EX 600` + bản sao ở bảng `persist_redis`) và xoá bộ đếm sai cũ."]]}], "short": "Tạo OTP", "ba": {"b": {"redis": {}}, "a": {"redis": {"otp:register:minh.tran@example.com": "482913  (hết hạn 08:10:00)"}}, "bl": "Redis", "al": "Redis"}, "idea": "OTP là **mã xác nhận gửi qua bưu điện**: thư viện in một mã lên phiếu, gửi về địa chỉ Minh khai. Ai cầm được thư mới đọc được mã."}, {"id": "1.11", "lane": "svc", "title": "Service — xếp việc gửi email vào hàng đợi", "sum": "Gửi email qua SMTP mất vài giây và có thể lỗi. Service không chờ việc đó: nó chỉ đẩy một \"job\" vào hàng đợi BullMQ (chạy trên Redis) rồi đi tiếp.", "code": [{"f": "S", "a": 89, "b": 95, "n": [[90, 95, "Dữ liệu job: người nhận, mã OTP, tên hiển thị, số phút hiệu lực (10)."]]}, {"f": "MQ", "a": 20, "b": 22, "n": [[21, 21, "Tên job `send-otp`. Cấu hình mặc định: thử tối đa 3 lần, lùi dần (exponential) từ 2 giây — xem [[N11|N11]]."]]}], "short": "Xếp hàng email"}, {"id": "1.12", "lane": "mail", "title": "Worker nền — dựng email và gửi qua SMTP", "sum": "Một worker BullMQ (chạy cùng tiến trình server, 5 job song song) nhận job và gọi MailService. Việc này diễn ra **song song** với phần còn lại của request.", "code": [{"f": "MW", "a": 17, "b": 30, "n": [[20, 22, "Đúng loại job → gọi `sendOtpEmail`."], [23, 25, "Gửi thất bại → ném lỗi để BullMQ thử lại (tối đa 3 lần)."]]}, {"f": "MS", "a": 75, "b": 116, "n": [[86, 91, "Môi trường khác `production` → **in OTP ra console**: `🔑 [DEV OTP] Mã xác thực gửi tới minh.tran@example.com: 482913 (Hiệu lực: 10 phút)`."], [93, 94, "Không truyền tiêu đề riêng → dùng `mail.verifyOtpSubject` = \"Mã xác thực tài khoản Roomee\"."], [95, 102, "Dựng HTML từ template."], [104, 113, "Gửi qua `sendMail` (nodemailer → Gmail SMTP). Bản text: \"Mã OTP xác thực của bạn là: 482913. Mã này có hiệu lực trong 10 phút.\""], [115, 115, "Trả `true/false` cho worker."]]}], "short": "Worker gửi email", "nh": ["Hết 3 lần thử mà vẫn lỗi: job nằm ở trạng thái failed (giữ 7 ngày để debug). Người dùng **không được báo**; API đã trả 200 từ trước. Họ chỉ có thể chờ 60 giây rồi bấm Gửi lại."]}, {"id": "1.13", "lane": "svc", "title": "Service — đặt thời gian chờ 60 giây cho nút Gửi lại", "sum": "Ngay sau khi gửi mã, service ghi một key \"cooldown\" sống 60 giây. Luồng Gửi lại (luồng 3) và Đăng nhập khi chưa xác thực (luồng 4) đều kiểm tra key này.", "code": [{"f": "S", "a": 97, "b": 102, "n": [[99, 99, "Key `otp:cooldown:minh.tran@example.com` (dùng chung giữa register, resend, login)."], [101, 101, "60 giây. Màn OTP phía app cũng đếm ngược đúng 60 giây (`otp_screen.dart:36`)."]]}], "short": "Cooldown 60s"}, {"id": "1.14", "lane": "svc", "title": "Trả kết quả — bỏ password, gắn code NEED_VERIFY_EMAIL", "sum": "Object `savedUser` vẫn đang chứa chuỗi hash. Service tách nó ra trước khi trả về.", "code": [{"f": "S", "a": 104, "b": 109, "n": [[104, 104, "Destructuring: lấy `password` ra biến bỏ đi `_`, phần còn lại là user an toàn."], [108, 108, "`code: \"NEED_VERIFY_EMAIL\"` báo app: tài khoản tạo xong nhưng phải nhập OTP."]]}, {"f": "CR", "a": 2, "b": 13, "n": [[8, 12, "Mọi response thành công có cùng khung `{success, message, data}`."]]}], "short": "Trả response", "ba": {"b": {"savedUser": {"id": "7b1e4c2a-5d3f-4a8e-9c61-2f0d8b7e1a54", "email": "minh.tran@example.com", "password": "$argon2id$v=19$m=65536,t=3,p=4$k3Vv…", "isEmailVerified": false}}, "a": {"success": true, "message": "Thành công", "data": {"user": {"id": "7b1e4c2a-5d3f-4a8e-9c61-2f0d8b7e1a54", "email": "minh.tran@example.com", "isEmailVerified": false}, "code": "NEED_VERIFY_EMAIL"}}, "bl": "trong service", "al": "HTTP 200 body"}}, {"id": "1.15", "lane": "ui", "title": "Flutter nhận kết quả — lưu user, mở màn OTP", "sum": "Response bay ngược về app. Không có token, nên app chỉ cache thông tin user rồi chuyển sang màn nhập mã.", "code": [{"f": "FDTO", "a": 106, "b": 118, "n": [[107, 108, "Không có `accessToken` → `token = ''`."], [116, 116, "`code` = `\"NEED_VERIFY_EMAIL\"`."]]}, {"f": "FREPO", "a": 45, "b": 55, "n": [[46, 48, "Token rỗng → **không** ghi `access_token`."], [49, 51, "Refresh token `null` → bỏ qua."], [52, 54, "Lưu user vào SecureStorage key `cached_user`."]]}, {"f": "FREG", "a": 107, "b": 121, "n": [[108, 108, "Chỉ phản ứng khi trạng thái trước đó là Loading."], [110, 121, "`AuthOtpRequired` → thông báo xanh rồi `pushReplacement('/otp')` kèm `destination` (email Minh gõ, chưa hạ chữ thường) và `purpose: 'register'`."]]}], "short": "App mở màn OTP"}], "table": ["`fullName, email, password, phoneNumber, gender, role, provinceId, wardId, birthday`", "Rate limit 10/15 phút/IP · Zod (email, mật khẩu ≥ 8, SĐT VN, role ∈ {landlord, tenant}) · email chưa tồn tại", "INSERT `users` (hash argon2, `isEmailVerified=false`) · Redis `otp:register:*` (600s) · `otp:cooldown:*` (60s) · job `send-otp`", "200 `{user, code: \"NEED_VERIFY_EMAIL\"}` (không token) · email chứa OTP", "400 validate · 409 email đã dùng · 429 quá tần suất · 500 lỗi DB/queue"], "scenarios": [{"id": "ok", "kind": "ok", "label": "Đăng ký thành công", "desc": "Minh đăng ký lúc **08:00:00 thứ Hai 09/11**, gõ email có chữ hoa `Minh.Tran@example.com`.", "init": "W0", "steps": [{"lane": "ui", "f": "FREG", "line": 69, "title": "Minh bấm Đăng ký — form tự kiểm tra", "why": "Validator phía app chạy trên từng ô. Tất 00/api/v1/auth/register\nContent-Type: application/json\nAccept-Language: vi\nUser-Agent: Dart/3.9 (dart:io)\n\n{\n \"fullName\": \"Trần Minh\",\n \"email\": \"Minh.Tran@example.com\",\n \"password\": \"abc123\",\n \"phoneNumber\": \"0912345678\",\n \"gender\": \"male\",\n \"role\": \"tenant\",\n \"provinceId\": 1,\n \"wardId\": 1,\n \"birthday\": \"2001-04-12\"\n}"}, "pk": "POST", "t": "T2 09/11 07:58:00", "st": ["validate(registerSchema)", "registerRateLimiter", "Router POST /api/v1/auth/register"]}, {"lane": "mw", "f": "RV", "line": 80, "title": "passwordRule: min 8, không trim", "why": "\"abc123\" chỉ có 6 ký tự → Zod ghi một issue cho trường `password`.", "d": "N9", "v": {"issues": [{"path": ["password"], "message": "Password must be at least 8 characters"}]}, "pk": "issue", "st": ["zod.safeParse", "validate(registerSchema)"]}, {"lane": "mw", "f": "VM", "line": 10, "title": "Gom lỗi thành {field, message}", "d": "1.6", "v": {"errors": [{"field": "password", "message": "Password must be at least 8 characters"}]}, "pk": "errors", "st": ["validate(registerSchema)"]}, {"lane": "mw", "f": "VM", "line": 14, "title": "Trả 400 ngay, controller không chạy", "why": "Không có truy vấn DB nào.", "d": "1.6", "net": {"res": "400 Bad Request\n{\n \"success\": false,\n \"message\": \"Dữ liệu gửi lên không hợp lệ.\",\n \"errors\": [\n  {\n   \"field\": \"password\",\n   \"message\": \"Password must be at least 8 characters\"\n  }\n ]\n}"}, "pk": "400", "st": ["validate(registerSchema)"], "err": true}]}]}, {"id": "verify-otp", "no": "2", "short": "Verify OTP", "title": "Xác thực OTP đăng ký", "endpoint": "POST /api/v1/auth/verify-otp", "summary": "So mã người dùng gõ với mã trong Redis bằng script Lua nguyên tử. Đúng thì bật `isEmailVerified`, tạo phiên trong `refresh_tokens` và trả cặp token: xác thực xong là **đăng nhập luôn**.", "idea": "Minh mang **mã trong thư bưu điện** ra quầy. Khớp thì thư viện đóng dấu \"đã xác nhận\" lên thẻ và phát luôn vòng tay vào cổng.", "details": [{"id": "2.1", "lane": "ui", "title": "Màn OTP — ghép 6 ô thành một mã", "sum": "Màn OTP có 6 ô, mỗi ô một chữ số. Khi Minh bấm Xác nhận, app ghép lại và chọn sự kiện theo `purpose`.", "code": [{"f": "FOTP", "a": 155, "b": 199, "n": [[157, 157, "Ghép text của 6 ô: `\"7\"+\"3\"+\"6\"+\"2\"+\"0\"+\"5\"` → `\"736205\"`."], [158, 163, "Thiếu chữ số → báo lỗi ngay trên màn, không gọi server."], [169, 187, "Nhánh `onVerify` tuỳ biến (màn OTP dùng lại cho chỗ khác). Luồng auth không truyền nên bỏ qua."], [189, 189, "Email lấy từ `destination` mà màn Đăng ký/Đăng nhập truyền sang."], [192, 196, "`purpose == 'forgot_password'` → luồng 7; còn lại → `AuthVerifyOtpEvent` (luồng này)."]]}], "short": "Màn OTP"}, {"id": "2.2", "lane": "bloc", "title": "AuthBloc và Repository — gửi email + mã", "sum": "Giống luồng 1: Bloc bật Loading, Repository gọi DataSource, Dio gửi POST.", "code": [{"f": "FBLOC", "a": 166, "b": 195, "n": [[172, 175, "Gọi repository với email và mã."], [176, 176, "Thành công: kích hoạt đồng bộ dữ liệu offline (NetworkSentinel)."], [177, 183, "Phát `Authenticated` mang user + 2 token."], [184, 191, "Lỗi từ server (ví dụ 400 OTP sai) → `AuthFailure`."]]}, {"f": "FREM", "a": 38, "b": 47, "n": [[42, 46, "Body chỉ có `{email, otp}`."]]}], "short": "Bloc & Repository"}, {"id": "2.3", "lane": "mw", "title": "Route verify-otp — rate limit 10/phút và kiểm tra định dạng mã", "sum": "Server nhận request. Lớp rate limit ở đây là chốt chặn đầu tiên chống dò mã.", "code": [{"f": "R", "a": 50, "b": 55, "n": [[52, 52, "10 request/phút/IP (`rateLimitMiddleware.ts:48–51`)."], [53, 53, "Schema chỉ gồm email và otp."]]}, {"f": "SC", "a": 61, "b": 64, "n": [[62, 62, "Email: trim + hạ chữ thường → `Minh.Tran@…` thành `minh.tran@…`."], [63, 63, "Đúng 6 chữ số."]]}, {"f": "RV", "a": 306, "b": 310, "n": [[307, 310, "`^\\d{6}$`: `\"73620a\"` hay `\"7362\"` đều bị 400 `OTP must be 6 digits`."]]}], "short": "Route & validate"}, {"id": "2.4", "lane": "ctrl", "title": "Controller — lấy thông tin thiết bị và IP", "sum": "Nếu mã đúng, server sẽ tạo phiên đăng nhập. Controller ghi lại thiết bị và IP để lưu vào phiên.", "code": [{"f": "C", "a": 73, "b": 95, "n": [[79, 81, "`User-Agent` của Dio: `Dart/3.9 (dart:io)` (tối đa 255 ký tự)."], [82, 82, "`req.ip` phụ thuộc cấu hình `trust proxy` ([[N1|N1]]). Tối đa 45 ký tự (vừa IPv6)."], [85, 90, "Gọi `authService.verifyOtp`."]]}], "short": "Controller"}, {"id": "2.5", "lane": "svc", "title": "OtpService — kiểm tra mã bằng script Lua nguyên tử", "sum": "Đây là trái tim của luồng. Toàn bộ \"đọc mã → so → đếm sai → xoá\" chạy trong **một** lệnh Redis nên hai request song song không chen nhau được. Chi tiết từng dòng ở [[N5|N5]].", "code": [{"f": "S", "a": 154, "b": 157, "n": [[154, 154, "Mục đích `register` → key `otp:register:minh.tran@example.com`."], [155, 157, "Sai/hết hạn/hết lượt đều thành **một** thông báo chung: \"Mã xác thực (OTP) không hợp lệ hoặc đã hết hạn.\""]]}, {"f": "O", "a": 66, "b": 117, "n": [[69, 72, "Key không còn (hết 10 phút, hoặc đã bị xoá) → trả 0."], [73, 75, "Khớp → xoá cả mã lẫn bộ đếm, trả 1. Mã chỉ dùng được **một lần**."], [77, 83, "Sai → tăng bộ đếm. Lần sai đầu tiên cho bộ đếm cùng hạn với mã."], [84, 86, "Sai tới lần thứ 5 → xoá luôn mã: phải xin mã mới."], [100, 103, "Kết quả 1 → xoá bản sao trong PostgreSQL rồi trả `true`."], [104, 117, "Kết quả -1 → ghi số lần sai xuống DB (TTL 600s), trả `false`."]]}], "short": "Kiểm tra OTP (Lua)", "br": ["Mã sai (lần 1–4) → **400** \"Mã xác thực (OTP) không hợp lệ hoặc đã hết hạn.\" · bộ đếm `otp:attempts:register:*` tăng 1.", "Mã sai lần thứ 5 → mã bị xoá ngay trong Lua → **400** cùng thông báo. Từ giờ cả mã đúng cũng bị từ chối.", "Mã đã hết hạn (Redis tự xoá key sau 600s) → Lua trả 0 → fallback đọc lại qua CacheService → Redis vẫn chạy nên không đọc DB → `false` → **400**."], "nh": ["Thông báo không cho biết còn bao nhiêu lần thử, cũng không phân biệt \"sai\" với \"hết hạn\". Người dùng chỉ biết bấm Gửi lại."]}, {"id": "2.6", "lane": "svc", "title": "Service — tìm user, kiểm tra còn hoạt động, bật isEmailVerified", "sum": "Mã đúng nghĩa là Minh sở hữu hộp thư. Service đánh dấu tài khoản đã xác thực.", "code": [{"f": "S", "a": 159, "b": 177, "n": [[159, 165, "Lấy user kèm tỉnh và phường (JOIN) để trả về app đầy đủ."], [166, 168, "Không còn user (ví dụ bị xoá giữa chừng) → **404**."], [170, 172, "`isActive=false` → **403** \"Tài khoản của bạn đã bị khóa hoặc chưa kích hoạt.\""], [174, 175, "`UPDATE users SET \"isEmailVerified\" = true, \"updatedAt\" = now() WHERE id = …`"], [177, 177, "Đăng nhập luôn: tạo phiên + cặp token ([[N7|N7]])."]]}], "short": "Bật isEmailVerified", "ba": {"b": {"users.isEmailVerified": false, "users.updatedAt": "09/11 08:00:00", "refresh_tokens": "(trống)"}, "a": {"users.isEmailVerified": true, "users.updatedAt": "09/11 08:03:20", "refresh_tokens": {"id": "c41d9a20-6f3b-4e7a-b812-5a90e3d7f101", "tokenHash": "fbcde798…8abd", "expiresAt": "16/11 08:03:20", "isRevoked": false}}, "bl": "DB", "al": "DB"}}, {"id": "2.7", "lane": "svc", "title": "createSessionAndTokens — một dòng phiên + hai token", "sum": "Phần này dùng chung cho verify OTP, login và reset password. Giải thích đầy đủ ở [[N7|N7]]; ở đây là giá trị cụ thể của Minh.", "code": [{"f": "S", "a": 180, "b": 231, "n": [[190, 190, "Refresh token thô: 32 byte ngẫu nhiên → 64 ký tự hex `79eda1a8…815e`."], [191, 194, "Chỉ lưu **SHA-256** của nó: `fbcde798…8abd`. DB bị lộ cũng không dùng được."], [195, 197, "Hết hạn sau 7 ngày: 16/11 08:03:20."], [199, 207, "INSERT vào `refresh_tokens`. `id` của dòng này là **session id** (sid) `c41d9a20…`."], [210, 222, "Ký JWT HS256 bằng `JWT_SECRET`, sống 15 phút, mang `sub`, `email`, `role`, `sid`."], [226, 230, "Trả token thô cho app (lần duy nhất server thấy nó dạng thô)."]]}], "short": "Tạo phiên & token", "ba": {"b": {"accessToken": null, "refreshToken": null}, "a": {"accessToken": "eyJhbGciOiJIUzI1NiIsIn…IDkN9Q", "accessToken.payload": {"sub": "7b1e4c2a-5d3f-4a8e-9c61-2f0d8b7e1a54", "em earer không?", "sum": "Route `/me` không có rate limit hay validate; lớp duy nhất là `authMiddleware` ([[N8|N8]]).", "code": [{"f": "R", "a": 85, "b": 89, "n": [[87, 87, "Chỉ có authMiddleware."]]}, {"f": "AM", "a": 14, "b": 24, "n": [[15, 18, "Không có header hoặc không bắt đầu bằng `Bearer ` → **401** ngay."], [20, 20, "Cắt 7 ký tự `Bearer ` lấy token."]]}], "short": "Kiểm tra header", "br": ["Thiếu header/sai tiền tố/token rỗng → **401** `{\"success\":false,\"message\":\"Bạn chưa được cấp quyền truy cập.\",\"errors\":null}`."]}, {"id": "5.4", "lane": "mw", "title": "jwt.verify — chữ ký đúng và còn hạn?", "sum": "Thư viện jsonwebtoken kiểm tra chữ ký HS256 bằng `JWT_SECRET`, kiểm tra thuật toán nằm trong danh sách cho phép và `exp` chưa qua.", "code": [{"f": "AM", "a": 26, "b": 44, "n": [[35, 37, "Chỉ chấp nhận `HS256` (chặn kiểu tấn công đổi `alg`)."], [37, 44, "Kết quả: payload đã giải mã."]]}, {"f": "AM", "a": 72, "b": 74, "n": [[72, 74, "Mọi lỗi (sai chữ ký, hết hạn, sai định dạng) → **401** cùng một thông báo."]]}], "short": "jwt.verify", "br": ["Token hết hạn: thư viện ném `TokenExpiredError` → 401. Phía app, AuthInterceptor sẽ tự gọi `/auth/refresh-token` rồi gửi lại request (xem kịch bản lỗi \"Token hết hạn\" trong debugger)."]}, {"id": "5.5", "lane": "mw", "title": "Session có bị thu hồi tức thời không?", "sum": "JWT hợp lệ tới khi hết hạn, server không \"rút\" được. Code bù lại bằng một **danh sách đen** theo `sid` trong Redis, được ghi khi đăng xuất.", "code": [{"f": "AM", "a": 46, "b": 71, "n": [[47, 55, "`GET blacklist:session:<sid>` (ưu tiên Redis, Redis sập thì đọc persist_redis). Có → **401**."], [57, 58, "Gắn payload và token vào `req` cho tầng sau."], [61, 71, "Ghi `userId`, `role` vào RequestContext để AuditSubscriber biết ai đang sửa dữ liệu."]]}], "short": "Blacklist sid", "nh": ["Middleware **không** kiểm tra bảng `refresh_tokens.isRevoked` và không kiểm tra `users.isActive`. Phiên bị thu hồi ở DB nhưng không có blacklist (ví dụ sau khi đặt l EPO", "line": 202, "title": "Xoá cache Hive của tài khoản", "d": "9.2", "pk": "Hive", "st": ["AuthRepository.logout"]}, {"lane": "repo", "f": "FREPO", "line": 207, "title": "Gọi remote.logout()", "d": "9.2", "pk": "call", "st": ["AuthRepository.logout"]}, {"lane": "net", "f": "FINT", "line": 75, "title": "POST /auth/logout với token đã hết hạn", "d": "9.2", "net": {"req": "POST http://10.0.2.2:5000/api/v1/auth/logout\nContent-Type: application/json\nAccept-Language: vi\nUser-Agent: Dart/3.9 (dart:io)\nAuthorization: Bearer eyJhbGciOiJIUzI1NiIsIn…ijzYPM"}, "pk": "POST", "st": ["AuthInterceptor.onRequest"]}, {"lane": "mw", "f": "AM", "line": 73, "title": "jwt.verify ném lỗi hết hạn → 401", "d": "N8", "net": {"res": "401 Unauthorized\n{\n \"success\": false,\n \"message\": \"Bạn chưa được cấp quyền truy cập.\",\n \"errors\": null\n}"}, "pk": "401", "st": ["authMiddleware"], "err": true}, {"lane": "repo", "f": "FINT", "line": 187, "title": "Interceptor tự làm mới token S3", "d": "N7", "net": {"req": "POST http://10.0.2.2:5000/api/v1/auth/refresh-token\nContent-Type: application/json\nAccept-Language: vi\nUser-Agent: Dart/3.9 (dart:io)\n\n{\n \"refreshToken\": \"0a4d3b68465b…060a\"\n}"}, "pk": "refresh", "st": ["AuthInterceptor.onError"]}, {"lane": "db", "f": "S", "line": 623, "title": "Server xoay vòng refresh token S3", "d": "N7", "net": {"res": "200 OK\n{\n \"success\": true,\n \"message\": \"Làm mới phiên đăng nhập thành công.\",\n \"data\": {\n  \"accessToken\": \"eyJhbGciOiJIUzI1NiIs…(mới, hết 21:45)\",\n  \"refreshToken\": \"9f3e…(mới)\"\n }\n}"}, "db": [{"op": "rt", "id": "1f7c6e83-9b2a-4d15-8c3e-6a71d0b5f303", "set": {"tokenHash": "9d2a7b1c…a1c0", "previousTokenHash": "255e9afe…34f8", "expiresAt": "22/11 21:30:00"}}], "pk": "ROTATE", "st": ["AuthService.refreshToken"]}, {"lane": "net", "f": "FINT", "line": 238, "title": "Gửi lại POST /auth/logout với token mới", "d": "N12", "net": {"req": "POST http://10.0.2.2:5000/api/v1/auth/logout\nAuthorization: Bearer eyJhbGciOiJIUzI1NiIs…(mới)"}, "pk": "retry", "st": ["AuthInterceptor.onError"]}, {"lane": "db", "f": "S", "line": 513, "title": "Thu hồi S3", "d": "9.4", "db": [{"op": "rt", "id": "1f7c6e83-9b2a-4d15-8c3e-6a71d0b5f303", "set": {"isRevoked": true}}], "pk": "REVOKE", "st": ["AuthService.logout", "AuthController.logoutUser", "authMiddleware", "Router POST /api/v1/auth/logout"]}, {"lane": "db", "f": "S", "line": 514, "title": "Blacklist sid 900 giây (token mới vừa cấp)", "d": "9.4", "v": {"remainingTtl": 900}, "db": [{"op": "kv", "key": "blacklist:session:1f7c6e83-9b2a-4d15-8c3e-6a71d0b5f303", "value": "1", "exp": "21:45:00"}], "pk": "BLACKLIST", "st": ["AuthService.logout", "AuthController.logoutUser", "authMiddleware", "Router POST /api/v1/auth/logout"]}, {"lane": "ctrl", "f": "C", "line": 163, "title": "HTTP 200", "d": "9.3", "net": {"res": "200 OK\n{\n \"success\": true,\n \"message\": \"Đăng xuất thành công.\",\n \"data\": null\n}"}, "pk": "200", "st": ["AuthController.logoutUser", "authMiddleware", "Router POST /api/v1/auth/logout"]}, {"lane": "repo", "f": "FREPO", "line": 211, "title": "finally: xoá phiên trong máy", "d": "9.2", "pk": "clear", "st": ["AuthRepository.logout"]}, {"lane": "ui", "f": "FHOME", "line": 44, "title": "/welcome", "d": "9.1", "pk": "/welcome", "st": ["BlocConsumer.listener"]}]}]}], "foundIntro": "Các khối dưới đây được 9 luồng dùng lại. Mỗi luồng ở §3 sẽ trỏ về đây (ví dụ [[N5|N5]]) thay vì giải thích lại. Mã nguồn trích nguyên văn, số dòng là số dòng thật trong commit ở đầu trang.", "found": [{"id": "N1", "lane": "router", "title": "Đường đi của một request trong Express", "sum": "Mọi request đi qua cùng một chuỗi: middleware toàn cục → router `/api/v1/auth` → middleware riêng của route → controller. Lỗi ở bất kỳ đâu đều rơi về một bộ xử lý lỗi chung.", "code": [{"f": "APP", "a": 37, "b": 60, "n": [[37, 53, "`trust proxy`: Express lấy `req.ip` từ header `X-Forwarded-For` khi tin proxy phía trước. Mặc định tin **1 hop** (dòng 51). IP này là chìa khoá cho rate limit và khoá đăng nhập."], [56, 56, "CORS mở cho mọi origin (thư viện `cors` mặc định)."], [57, 57, "Parse JSON (thư viện, giới hạn mặc định 100 KB)."], [59, 59, "Tạo \"túi ngữ cảnh\" AsyncLocalStorage cho request: `{userId: null, role: null}`."], [60, 60, "Chọn ngôn ngữ từ `?lang=` hoặc `Accept-Language`; hàm `t()` toàn cục dịch theo đó."]]}, {"f": "ROUTES", "a": 16, "b": 20, "n": [[18, 18, "Tiền tố `/api/v1` (đổi được bằng biến môi trường `API_PREFIX`)."], [20, 20, "Module auth gắn ở `/auth`."]]}, {"f": "R", "a": 31, "b": 90, "n": [[32, 79, "8 route POST công khai: chỉ rate limit + validate."], [80, 89, "2 route cần đăng nhập: `logout`, `me` dùng `authMiddleware`."]]}], "short": "Đường đi request", "idea": "Request giống **khách tới thư viện**: qua cửa chung (middleware toàn cục), tới đúng quầy (router), qua bảo vệ quầy (rate limit, validate, kiểm vòng tay), rồi mới gặp thủ thư (controller)."}, {"id": "N2", "lane": "db", "title": "Bảng users và refresh_tokens", "sum": "Hai bảng PostgreSQL mà 9 luồng đọc/ghi. Trạng thái tài khoản nằm ở vài cột boolean; mỗi lần đăng nhập thêm một dòng `refresh_tokens`.", "code": [{"f": "U", "a": 19, "b": 29, "n": [[20, 20, "Email duy nhất **trong các dòng chưa xoá mềm** (`deletedAt IS NULL`)."], [22, 23, "Khoá chính UUID."], [28, 29, "`select: false`: mọi truy vấn thường **không** lấy cột này. Muốn so mật khẩu phải `addSelect` (`userRepository.ts:15`)."]]}, {"f": "U", "a": 60, "b": 87, "n": [[60, 61, "`isActive`: mặc định `true`. Không luồng nào trong 9 luồng đổi cột này; các luồng chỉ đọc để chặn (403)."], [83, 84, "`isEmailVerified`: `false` khi đăng ký; luồng 2 và luồng 8 bật thành `true`."], [86, 87, "`hasContract`: app dùng để chọn màn hình sau đăng nhập."]]}, {"f": "RT", "a": 14, "b": 54, "n": [[16, 17, "`id` của dòng = **session id (sid)**, được nhét vào JWT."], [27, 29, "SHA-256 của refresh token, 64 ký tự hex, duy nhất."], [31, 36, "Phục vụ xoay vòng refresh token: hash cũ + thời điểm xoay."], [38, 42, "Thiết bị và IP lúc tạo phiên."], [44, 48, "Hạn 7 ngày và cờ thu hồi."]]}], "short": "Bảng users & refresh_tokens"}, {"id": "N3", "lane": "db", "title": "CacheService — Redis là chính, PostgreSQL là bản sao", "sum": "OTP, cooldown, bộ đếm, khoá, resetToken, blacklist… đều đi qua `CacheService`. Mỗi lần ghi, nó ghi **cả** Redis lẫn bảng `persist_redis`, để lỡ Redis mất dữ liệu thì vẫn còn bản sao.", "code": [{"f": "PRE", "a": 10, "b": 24, "n": [[12, 13, "Khoá chính là tên key."], [15, 16, "Giá trị lưu dạng `jsonb` (OTP lưu nguyên văn)."], [21, 23, "Thời điểm hết hạn, có index cho cron dọn dẹp."]]}, {"f": "CS", "a": 16, "b": 45, "n": [[24, 26, "Đọc Redis trước."], [34, 39, "Redis trả lời được → dùng kết quả đó, **kể cả khi không có key**. Không xuống DB."], [41, 45, "Chỉ khi Redis lỗi/mất kết nối mới đọc `persist_redis` (còn hạn)."]]}, {"f": "CS", "a": 100, "b": 130, "n": [[110, 116, "`SET key value EX ttl`."], [121, 129, "Ghi/cập nhật dòng `persist_redis` (upsert theo key). Lỗi chỉ ghi log."]]}, {"f": "CS", "a": 235, "b": 268, "n": [[241, 245, "`INCR`; lần đầu (`count === 1`) đặt TTL."], [257, 260, "Sao chép số đếm xuống DB, giữ nguyên hạn cũ."]]}], "short": "CacheService", "idea": "Redis là **tờ giấy ghi chú dán tường**: đọc nhanh, tự bong ra khi hết hạn. Bảng `persist_redis` là **cuốn sổ chép tay** phòng khi tờ giấy bị gió thổi mất."}, {"id": "N4", "lane": "svc", "title": "OTP — tạo và lưu", "sum": "Mỗi OTP là 6 chữ số ngẫu nhiên, lưu theo key `otp:<mục đích>:<email>` trong 10 phút. Sinh mã mới thì ghi đè mã cũ và xoá bộ đếm sai.", "code": [{"f": "K", "a": 6, "b": 9, "n": [[6, 6, "600 giây = 10 phút."], [8, 8, "Tối đa 5 lần sai cho mỗi mã."]]}, {"f": "FH", "a": 7, "b": 11, "n": [[8, 10, "`crypto.randomInt(100000, 1000000)` (Node.js): ngẫu nhiên an toàn mật mã. Chữ số đầu luôn từ 1–9 → có **900.000** mã khả dĩ."]]}, {"f": "O", "a": 22, "b": 51, "n": [[22, 24, "Key: `otp:register:minh.tran@example.com`. Email được trim + hạ chữ thường."], [29, 31, "Key đếm sai: `otp:attempts:register:…`."], [45, 48, "Ghi OTP **nguyên văn** (không băm) và xoá bộ đếm sai cùng lúc."]]}], "short": "OTP: tạo & lưu", "nh": ["OTP lưu dạng chữ thường (plaintext) ở cả Redis và cột `persist_redis.value`. Ai đọc được DB hoặc bản backup trong 10 phút đó là đọc được mã."]}, {"id": "N5", "lane": "svc", "title": "OTP — kiểm tra bằng script Lua nguyên tử", "sum": "Redis chạy cả đoạn Lua như **một lệnh duy nhất**: không request nào chen vào giữa \"đọc mã\" và \"xoá mã\". Nhờ vậy một mã đúng không thể được dùng hai lần dù hai request tới cùng lúc.", "code": [{"f": "O", "a": 57, "b": 148, "n": [[66, 66, "Chỉ dùng Lua khi kết nối Redis sẵn sàng."], [69, 72, "Không có mã → 0."], [73, 75, "Khớp (so chuỗi `==`) → xoá mã + bộ đếm → 1."], [77, 83, "Sai → `INCR` bộ đếm; lần đầu cho bộ đếm cùng TTL còn lại của mã."], [84, 86, "Đủ 5 lần → xoá mã + bộ đếm."], [91, 98, "Gửi script, 2 key, mã người dùng gõ (đã trim) và số 5."], [100, 103, "1 → xoá bản sao DB, trả `true`."], [104, 116, "-1 → nếu bộ đếm còn thì sao chép xuống DB (TTL 600s), nếu đã bị xoá thì xoá luôn bản sao. Trả `false`."], [118, 119, "0 → rơi xuống phần dự phòng bên dưới."], [128, 132, "Dự phòng: đọc qua CacheService. Redis chạy bình thường mà không có key → `null` → `false`."], [134, 147, "Chỉ khi Redis sập mới thực sự so mã trong PostgreSQL, đếm sai bằng `cacheService.incr`."]]}], "short": "OTP: kiểm tra (Lua)", "idea": "Thủ thư mở phong bì, so mã và **xé phong bì** trong cùng một động tác, không ai kịp chen vào giữa."}, {"id": "N6", "lane": "svc", "title": "Băm mật khẩu — thư viện argon2", "sum": "Code chỉ gọi hai hàm. Mọi phần khó (sinh salt, tham số bộ nhớ/thời gian, so sánh an toàn) do **thư viện** `argon2` (npm) làm, với tham số mặc định của nó: biến thể argon2id.", "code": [{"f": "S", "a": 63, "b": 63, "n": [[63, 63, "Đăng ký: `argon2.hash(mậtKhẩu)` → chuỗi tự mô tả `$argon2id$v=19$m=…,t=…,p=…$<salt>$<hash>`. Mỗi lần gọi ra một salt khác nên cùng mật khẩu vẫn cho hash khác."]]}, {"f": "S", "a": 290, "b": 291, "n": [[290, 291, "Đăng nhập: `argon2.verify(hash, mậtKhẩuGõ)` đọc salt và tham số trong chính chuỗi hash, băm lại rồi so."]]}, {"f": "S", "a": 440, "b": 440, "n": [[440, 440, "Đặt lại mật khẩu: băm như đăng ký."]]}], "short": "argon2", "idea": "Hash là **vân tay của mật khẩu**. Salt giống việc mỗi lần lấy vân tay lại dùng một loại mực khác: hai người cùng mật khẩu vẫn có hai vân tay khác nhau."}, {"id": "N7", "lane": "svc", "title": "Token — access token (JWT 15 phút) và refresh token (7 ngày)", "sum": "Sau khi xác thực (verify OTP, login, reset), server tạo **một phiên** và **hai token**. Access token đi kèm mọi request; refresh token chỉ dùng để xin access token mới khi cái cũ hết hạn (route `/auth/refresh-token`, ngoài 9 luồng nhưng app gọi tự động).", "code": [{"f": "K", "a": 13, "b": 20, "n": [[13, 14, "Access token 15 phút."], [15, 16, "Refresh token 7 ngày."], [17, 17, "Cửa sổ 15 giây cho phép dùng lại refresh token vừa xoay (mạng di động chập chờn)."], [19, 20, "Chỉ HS256."]]}, {"f": "S", "a": 180, "b": 231, "n": [[190, 194, "Refresh token: 32 byte ngẫu nhiên → hex. DB chỉ giữ SHA-256 của nó."], [199, 207, "Một dòng `refresh_tokens` = một phiên."], [210, 222, "`jwt.sign` (thư viện jsonwebtoken): payload `{sub, email, role, sid}`, ký bằng `JWT_SECRET`, `exp` = +15 phút."], [224, 230, "Trả user không có password + 2 token."]]}, {"f": "S", "a": 603, "b": 639, "n": [[605, 609, "Làm mới: sinh refresh token mới."], [623, 639, "UPDATE nguyên tử `WHERE id AND tokenHash AND isRevoked=false`: hash cũ chuyển sang `previousTokenHash`. Hai request làm mới song song chỉ một cái thắng."]], "text": "Làm mới token (route `/auth/refresh-token`, dùng trong các kịch bản \"token hết hạn\"):"}, {"f": "S", "a": 547, "b": 551, "n": [[547, 551, "Refresh token của phiên đã thu hồi bị dùng lại → thu hồi **mọi** phiên của user (dấu hiệu bị đánh cắp)."]]}], "short": "Token & phiên", "idea": "Access token là **vòng tay vào cổng** (hết màu sau 15 phút). Refresh token là **phiếu đổi vòng tay** (7 ngày), mỗi lần đổi thì phiếu cũ bị huỷ và nhận phiếu mới."}, {"id": "N8", "lane": "mw", "title": "authMiddleware — bảo vệ route cần đăng nhập", "sum": "Dùng cho `/logout` và `/me`. Ba lớp kiểm tra: header đúng dạng → chữ ký/hạn JWT → `sid` không nằm trong danh sách đen.", "code": [{"f": "AM", "a": 9, "b": 75, "n": [[14, 24, "Header phải là `Bearer <token>`."], [35, 44, "`jwt.verify` (thư viện): sai chữ ký, sai thuật toán, hết hạn → ném lỗi."], [46, 55, "Danh sách đen theo `sid` (ghi khi logout)."], [57, 58, "`req.user`, `req.token` cho controller."], [61, 71, "Ghi `userId`, `role` vào RequestContext (AuditSubscriber dùng để điền `createdBy/updatedBy`)."], [72, 74, "Mọi lỗi → **401** \"Bạn chưa được cấp quyền truy cập.\""]]}], "short": "authMiddleware", "nh": ["Không kiểm tra `refresh_tokens.isRevoked` và `users.isActive` trong middleware. Thu hồi phiên chỉ có hiệu lực tức thời khi có key blacklist (chỉ luồng logout ghi)."], "idea": "Bảo vệ cổng **nhìn vòng tay**: đúng con dấu, chưa hết giờ, và số vòng tay không nằm trên danh sách đen dán ở cổng."}, {"id": "N9", "lane": "mw", "title": "Rate limit và validate", "sum": "Hai lớp đầu tiên của mọi route công khai.", "code": [{"f": "RL", "a": 12, "b": 57, "n": [[19, 32, "Thư viện `express-rate-limit`. Không truyền `store` → dùng bộ đếm trong **RAM** của tiến trình, khoá theo `req.ip`."], [35, 57, "Bốn instance: đăng ký 10/15 phút, resend 3/phút, verify 10/phút, login 10/phút. Route nào dùng chung instance thì **chung bộ đếm**: resend-otp + forgot-password; verify-otp + verify-reset-otp; login + reset-password + refresh-token."]]}, {"f": "RV", "a": 67, "b": 80, "n": [[68, 70, "Email: trim → ≤ 255 → hạ chữ thường → kiểm định dạng."], [75, 80, "Mật khẩu: không trim, min/max tuỳ schema."]]}, {"f": "VM", "a": 5, "b": 20, "n": [[9, 15, "Sai → **400** `{success:false, message:\"Dữ liệu gửi lên không hợp lệ.\", errors:[{field, message}]}`. Câu chi tiết từng field bằng tiếng Anh (viết cứng trong ruleValidate)."], [17, 17, "Đúng → thay `req.body` bằng dữ liệu đã làm sạch."]]}], "short": "Rate limit & validate"}, {"id": "N10", "lane": "ctrl", "title": "Chuẩn lỗi — từ AppError tới thông báo trên app", "sum": "Service ném `AppError` với mã HTTP; controller `next(error)`; bộ xử lý lỗi chung biến nó thành JSON. App Flutter đọc `message` và hiện nguyên văn.", "code": [{"f": "AE", "a": 1, "b": 48, "n": [[17, 47, "Các hàm tạo nhanh: 400, 401, 403, 404, 409, 423, 429, 500."]], "skip": [[13, 14, "giữ prototype và stack trace"]]}, {"f": "APP", "a": 108, "b": 132, "n": [[113, 121, "AppError → dùng đúng status, message, errors."], [123, 130, "Lỗi lạ (DB, code) → ghi log, trả **500** chung chung, không lộ SQL/stack."]]}, {"f": "CR", "a": 15, "b": 26, "n": [[21, 25, "Khung lỗi `{success:false, message, errors}`."]]}, {"f": "FEXC", "a": 35, "b": 92, "n": [[41, 46, "Lấy `message` và `errors` từ body."], [51, 91, "Map mã HTTP → loại exception. 409, 423, 429 rơi vào `default` → `ClientException`."]]}], "short": "Chuẩn lỗi"}, {"id": "N11", "lane": "mail", "title": "Email — hàng đợi BullMQ và SMTP", "sum": "Service không gửi email trực tiếp. Nó đẩy job vào hàng đợi (lưu trong Redis); worker chạy nền lấy job ra và gửi qua nodemailer.", "code": [{"f": "BQ", "a": 16, "b": 33, "n": [[19, 23, "Thử tối đa 3 lần, lùi dần 2s → 4s."], [24, 30, "Job thành công giữ 1 giờ; job lỗi giữ 7 ngày."]]}, {"f": "MS", "a": 13, "b": 35, "n": [[14, 18, "Cấu hình SMTP lấy từ biến môi trường (mặc định Gmail, cổng 465)."], [24, 34, "Chỉ tạo transporter khi có user + pass."]]}, {"f": "MS", "a": 40, "b": 70, "n": [[47, 54, "Chưa cấu hình SMTP: môi trường không phải production → coi như gửi thành công; production → thất bại."], [56, 69, "Gửi thật qua nodemailer."]]}], "short": "Email", "nh": ["OTP được in ra log (`mailService.ts:87–91`) ở **mọi** môi trường có `NODE_ENV` khác `production`, và `NODE_ENV` mặc định là `development` nếu không đặt (`constanst.ts:4`)."]}, {"id": "N12", "lane": "repo", "title": "Phía app — Dio, AuthInterceptor và SecureStorage", "sum": "Mọi request của app đi qua một Dio dùng chung. AuthInterceptor gắn token vào request và tự làm mới token khi gặp 401.", "code": [{"f": "FLOC", "a": 5, "b": 19, "n": [[8, 10, "Ba key trong SecureStorage (Keychain/Keystore): `access_token`, `refresh_token`, `cached_user`."]]}, {"f": "FREPO", "a": 45, "b": 55, "n": [[46, 54, "Chỉ ghi giá trị không rỗng. Dùng sau đăng ký, verify OTP, login, reset."]]}, {"f": "FINT", "a": 91, "b": 117, "n": [[94, 96, "Request đã thử lại một lần → không thử nữa (chống vòng lặp)."], [99, 101, "Chỉ xử lý 401."], [106, 111, "Chính `/auth/refresh-token` bị 401 → đăng xuất (`onUnauthorized`)."], [114, 117, "Request không mang Bearer (login sai mật khẩu, verify OTP sai) → trả lỗi bình thường."]]}, {"f": "FMAIN", "a": 53, "b": 57, "n": [[54, 57, "`onUnauthorized` = gửi `AuthLogoutEvent(preservePendingChanges: true)`."]]}], "short": "Dio & SecureStorage"}], "flowsIntro": "Chín luồng theo đúng hành trình của Minh. Mỗi bước: ở đâu, làm gì, code nguyên văn (trái) với chú thích căn theo dòng (phải; rê chuột lên dòng code hoặc bấm chú thích để tô sáng), dữ liệu trước/sau và các nhánh rẽ. Cuối mỗi luồng có bảng tóm tắt.", "sample": {"intro": "Một nhân vật, một tuần, một bộ giá trị. Mọi bước trong debugger và mọi ví dụ trước/sau dùng đúng các giá trị này, nên bạn có thể dò chéo: OTP ở email luồng 1 chính là chuỗi trong Redis ở bước 1.10. Giờ theo múi giờ Việt Nam (UTC+7). Hash, token, IP đều là **giả lập**.", "cards": [["Nhân vật", "**Trần Minh**, người thuê trọ (`tenant`, `hasContract=false`), sinh 12/04/2001, SĐT `0912345678`, Phường Ba Đình, Hà Nội (`provinceId=1`, `wardId=1`: id giả định theo thứ tự seed)."], ["Email", "Gõ `Minh.Tran@example.com` lúc đăng ký → server lưu `minh.tran@example.com`."], ["Mật khẩu", "Cũ `Minh@Roomee26` → `$argon2id$v=19$m=65536,t=3,p=4$k3Vv…` · Mới `TroMoi#2026` → `$argon2id$v=19$m=65536,t=3,p=4$cGhv…`"], ["Thiết bị", "Android emulator · User-Agent `Dart/3.9 (dart:io)` · baseUrl trong code `http://10.0.2.2:5000/api/v1` · IP giả lập `113.161.42.7`"], ["user id", "`7b1e4c2a-5d3f-4a8e-9c61-2f0d8b7e1a54`"], ["OTP", "Đăng ký `482913` (gõ nhầm `482193`) → gửi lại `736205` · Đặt lại mật khẩu `591047` (gõ nhầm `591074`)"], ["Phiên (refresh_tokens)", "S1 `c41d9a20…f101` 09/11 08:03:20 · S2 `e8a35b14…f202` 11/11 19:30:00 · S3 `1f7c6e83…f303` 15/11 21:05:00"], ["Token", "Access token S1 `eyJhbGciOiJIUzI1NiIsIn…IDkN9Q` (ký thật bằng secret giả `roomee-dev-secret`) · refresh token S1 `79eda1a8ca44…815e` → SHA-256 `fbcde7982c5c…8abd`"], ["resetToken", "`3f6c2a1e-8b4d-4c9a-9e21-7d5b0f1a6c33` (sống tới 21:18:10 ngày 15/11)"]]}, "trace": {"intro": "Hai bảng dưới đây là \"chạy tay\": từng biểu thức trong code, giá trị thật với dữ liệu của Minh, và nhánh được chọn. Đọc từ trên xuống giống như bấm Step Over.", "tables": [{"title": "Verify OTP: lần gõ sai (08:02:10) và lần gõ đúng (08:03:20)", "desc": "Hai request vào `POST /auth/verify-otp`. Giữa hai lần, Minh đã bấm Gửi lại (luồng 3) nên mã trong Redis đổi từ 482913 sang 736205.", "cols": ["#", "Dòng code", "Biểu thức", "Lần 1 · gõ 482193", "Lần 2 · gõ 736205"], "rows": [["1", "`ruleValidate.ts:307–310`", "`/^\\d{6}$/` khớp?", "✓", "✓"], ["2", "`otpService.ts:22–24`", "`key`", "`otp:register:minh.tran@example.com`", "như lần 1"], ["3", "`otpService.ts:66`", "`redis.status === \"ready\"`", "true", "true"], ["4", "`otpService.ts:69`", "`stored = GET key` (hạn do TTL Redis)", "`\"482913\"` (TTL còn 470s, hết 08:10:00)", "`\"736205\"` (TTL còn 555s, hết 08:12:35)"], ["5", "`otpService.ts:70`", "`not stored`", "false → đi tiếp", "false → đi tiếp"], ["6", "`otpService.ts:73`", "`stored == ARGV[1]`", "`\"482913\" == \"482193\"` → **false**", "`\"736205\" == \"736205\"` → **true**"], ["7", "`otpService.ts:74–75`", "DEL mã + bộ đếm, return 1", "(bỏ qua)", "đã xoá, **return 1**"], ["8", "`otpService.ts:77`", "`attempts = INCR attemptsKey`", "**1**", "(bỏ qua)"], ["9", "`otpService.ts:78–83`", "`attempts == 1` → `EXPIRE attemptsKey ttl`", "true → TTL 470s", "(bỏ qua)"], ["10", "`otpService.ts:84`", "`attempts >= 5`", "`1 >= 5` → false (mã còn sống)", "(bỏ qua)"], ["11", "`otpService.ts:87`", "Lua trả về", "**-1**", "**1**"], ["12", "`otpService.ts:100–116`", "Nhánh JS", "`-1` → GET attempts = \"1\" → SET attempts EX 600 → `false`", "`1` → xoá bản sao DB → `true`"], ["13", "`authService.ts:155`", "`!isOtpValid`", "true → **400** \"Mã xác thực (OTP) không hợp lệ hoặc đã hết hạn.\"", "false → đi tiếp"], ["14", "`authService.ts:170, 174–175`", "`isActive` → bật `isEmailVerified`", "—", "true → UPDATE users"], ["15", "`authService.ts:177`", "Tạo phiên + token", "—", "S1 + JWT (hết 08:18:20) → **200**"]], "rowcls": ["", "", "", "", "", "", "", "", "", "", "", "", "", "", ""]}, {"title": "Login: lần gõ sai (19:29:30) và lần gõ đúng (19:30:00)", "desc": "Hai request vào `POST /auth/login` từ cùng IP `113.161.42.7`.", "cols": ["#", "Dòng code", "Biểu thức", "Lần A · gõ Minh@roomee26", "Lần B · gõ Minh@Roomee26"], "rows": [["1", "`authService.ts:244`", "`normalizedEmail`", "`minh.tran@example.com`", "như A"], ["2", "`authService.ts:245–247`", "`lockoutKey`, `attemptsKey`", "`login:lockout:minh.tran@example.com:113.161.42.7`, `login:attempts:…`", "như A"], ["3", "`authService.ts:250–251`", "`GET lockoutKey`", "null → không khoá", "null → không khoá"], ["4", "`authService.ts:284–288`", "`findByEmailWithPassword`", "có user, `password` = `$argon2id$v=19$m=65536,t=3,p=4$k3Vv…`", "như A"], ["5", "`authService.ts:290–291`", "`argon2.verify(hash, input)`", "**false**", "**true**"], ["6", "`authService.ts:261–264`", "`INCR attemptsKey` (TTL 900s)", "**1** (hết 19:44:30)", "(bỏ qua)"], ["7", "`authService.ts:266`", "`attempts >= 5`", "false → `remaining = 4`", "(bỏ qua)"], ["8", "`authService.ts:277–281`", "throw 401", "**401** \"…Bạn còn 4 lần thử…\"", "(bỏ qua)"], ["9", "`authService.ts:296`", "`!user.isActive`", "—", "false → đi tiếp"], ["10", "`authService.ts:300`", "`DEL attemptsKey`", "—", "xoá \"1\""], ["11", "`authService.ts:304`", "`!user.isEmailVerified`", "—", "false → không gửi OTP"], ["12", "`authService.ts:190–207`", "random 32 byte → SHA-256 → INSERT", "—", "phiên S2 `e8a35b14…f202`"], ["13", "`authService.ts:210–222`", "`jwt.sign({sub, email, role, sid})`", "—", "exp 19:45:00 → **200**"]]}]}, "timeline": {"intro": "Ghép 9 luồng thành một câu chuyện liên tục. Cột \"DB\" là những gì đổi trong PostgreSQL và Redis sau sự kiện. Để dễ theo dõi, các lần app tự làm mới token trong tuần được lược bỏ.", "events": [{"when": "T2 09/11 · 08:00:00", "lane": "ui", "what": "Minh đăng ký bằng `Minh.Tran@example.com`", "state": "Chờ xác thực", "link": "#flow-register", "db": ["users: INSERT Minh (`isEmailVerified=false`, hash $argon2id$v=19$m=65536,t=3,p=4$k3Vv…)", "Redis: `otp:register:…` = 482913 (→08:10:00) · `otp:cooldown:…` (→08:01:00)", "Email 1: mã 482913"]}, {"when": "T2 09/11 · 08:02:10", "lane": "svc", "what": "Gõ nhầm `482193`", "state": "Chờ xác thực", "link": "#flow-verify-otp", "db": ["Redis: `otp:attempts:register:…` = 1 (→08:12:10)", "Response 400"]}, {"when": "T2 09/11 · 08:02:35", "lane": "mail", "what": "Bấm Gửi lại", "state": "Chờ xác thực", "link": "#flow-resend", "db": ["Redis: `otp:register:…` = **736205** (→08:12:35), xoá attempts, cooldown (→08:03:35)", "Email 2: mã 736205 (mã 482913 hết hiệu lực)"]}, {"when": "T2 09/11 · 08:03:20", "lane": "ctrl", "what": "Gõ đúng `736205`", "state": "Đã xác thực · có phiên", "link": "#flow-verify-otp", "db": ["users: `isEmailVerified=true`", "refresh_tokens: INSERT S1 (→16/11 08:03:20)", "Redis: xoá `otp:register:…`"]}, {"when": "T4 11/11 · 19:29:30", "lane": "mw", "what": "Cài lại app, đăng nhập gõ sai `Minh@roomee26`", "state": "Đã xác thực · có phiên (S1)", "link": "#flow-login", "db": ["Redis: `login:attempts:…:113.161.42.7` = 1 (→19:44:30)", "Response 401 \"còn 4 lần\""]}, {"when": "T4 11/11 · 19:30:00", "lane": "bloc", "what": "Đăng nhập đúng", "state": "Đã xác thực · 2 phiên", "link": "#flow-login", "db": ["refresh_tokens: INSERT S2 (→18/11 19:30:00)", "Redis: xoá `login:attempts:…`", "S1 vẫn sống: xoá app không gọi logout"]}, {"when": "T4 11/11 · 19:36:00", "lane": "svc", "what": "Mở lại app → `GET /auth/me`", "state": "Đã xác thực · 2 phiên", "link": "#flow-me", "db": ["Không đổi gì (chỉ đọc)", "App ghi đè `cached_user`"]}, {"when": "CN 15/11 · 21:00:00", "lane": "mail", "what": "Quên mật khẩu", "state": "Chờ OTP đặt lại", "link": "#flow-forgot", "db": ["Redis: `otp:forgot_password:…` = 591047 (→21:10:00) · `otp:cooldown:forgot_password:…` (→21:01:00)", "Email 3: mã 591047"]}, {"when": "CN 15/11 · 21:03:10", "lane": "db", "what": "Gõ đúng `591047`", "state": "Có resetToken", "link": "#flow-verify-reset", "db": ["Redis: xoá `otp:forgot_password:…` · `password_reset_token:3f6c2a1e…` = email (→21:18:10)"]}, {"when": "CN 15/11 · 21:05:00", "lane": "db", "what": "Đặt mật khẩu `TroMoi#2026`", "state": "Đã xác thực · 1 phiên (S3)", "link": "#flow-reset", "db": ["users: password = $argon2id$v=19$m=65536,t=3,p=4$cGhv…", "refresh_tokens: S1, S2 `isRevoked=true` · INSERT S3 (→22/11 21:05:00)", "Redis: xoá resetToken"]}, {"when": "CN 15/11 · 21:12:00", "lane": "router", "what": "Đăng xuất", "state": "Đã xác thực · không phiên", "link": "#flow-logout", "db": ["refresh_tokens: S3 `isRevoked=true`", "Redis: `blacklist:session:1f7c6e83…` (→21:20:00)", "App xoá SecureStorage"]}]}, "risksIntro": "Mỗi mục: mức độ, vị trí trong code, vấn đề, hậu quả trong một kịch bản cụ thể với Minh, và gợi ý sửa. Mức độ là đánh giá của người đọc code, có tính đến bối cảnh (app thuê trọ, chưa rõ hạ tầng triển khai).", "risks": [{"sev": "h", "title": "Khoá đăng nhập và rate limit chỉ dựa vào IP", "where": "`app.ts:37–53` (trust proxy mặc định 1) · `authService.ts:245–247` (key = email + IP) · `rateLimitMiddleware.ts:19–32` (khoá theo `req.ip`, lưu RAM)", "issue": "Bộ đếm 5 lần sai gắn với cặp **email + IP**. Rate limiter cũng đếm theo IP. Nếu server không đứng sau đúng một reverse proxy, Express tin header `X-Forwarded-For` do client tự đặt, nên `req.ip` bị giả được.", "impact": "Kẻ gian thử mật khẩu của Minh: cứ 4 lần thì đổi `X-Forwarded-For` (hoặc đổi IP thật qua botnet/proxy). Bộ đếm không bao giờ tới 5, rate limiter 10/phút cũng không chạm. Số lần thử chỉ bị giới hạn bởi tốc độ argon2.", "fix": "Đặt `TRUST_PROXY` đúng với hạ tầng (số hop thật, hoặc dải IP của proxy). Thêm bộ đếm theo **email** không phụ thuộc IP (ngưỡng cao hơn, tăng dần thời gian chờ). Dùng store Redis cho express-rate-limit."}, {"sev": "m", "title": "OTP 6 số có thể bị dò qua luồng quên mật khẩu", "where": "`functionHelper.ts:8–10` (900.000 mã) · `otpService.ts:45–48` (mã mới xoá bộ đếm) · `authService.ts:336–342` (cooldown 60s)", "issue": "Mỗi mã cho sai 5 lần. Nhưng cứ 60 giây gọi `forgot-password` là có mã mới và bộ đếm về 0. Không có giới hạn tổng số lần sai theo email.", "impact": "Kẻ gian nhắm vào Minh: mỗi phút xin mã mới + đoán 5 lần → 7.200 lần đoán/ngày → xác suất trúng ≈ 7.200 / 900.000 ≈ **0,8%/ngày**, ≈ 21% sau 30 ngày. Trúng thì nhận resetToken, đặt mật khẩu mới và chiếm tài khoản. Minh sẽ thấy hàng nghìn email OTP nhưng code không tự dừng. Kết hợp mục trên (giả IP), rate limit không cản được.", "fix": "Giới hạn số lần xin mã và tổng số lần sai theo email trong 24 giờ (ví dụ 10 mã/ngày, khoá đặt lại 1 giờ sau 20 lần sai). Cân nhắc mã dài hơn hoặc link một lần thay cho OTP ở luồng đặt lại."}, {"sev": "m", "title": "Đặt lại mật khẩu không cắt access token đang sống", "where": "`authService.ts:444–445` (chỉ UPDATE DB) · `authMiddleware.ts:46–55` (chỉ đọc blacklist)", "issue": "`revokeAllUserSessions` chặn refresh token, nhưng không ghi `blacklist:session:<sid>`. Middleware không đọc `refresh_tokens.isRevoked` nên access token của phiên cũ vẫn hợp lệ tới khi hết 15 phút. Tương tự, `isActive=false` không được middleware kiểm tra.", "impact": "21:05 Minh đặt lại mật khẩu vì nghi bị lộ. Kẻ gian đang giữ access token của S2 (vừa làm mới lúc 21:00) vẫn gọi được mọi API cần đăng nhập tới 21:15.", "fix": "Trong `resetPassword`, lấy danh sách `sid` còn sống trước khi thu hồi và ghi blacklist cho từng sid (TTL 900s). Hoặc thêm `tokenVersion`/`passwordChangedAt` vào user và so với `iat` trong middleware."}, {"sev": "m", "title": "OTP và resetToken lưu nguyên văn", "where": "`otpService.ts:45–48` · `cacheService.ts:121–129` · `persistRedis.ts:15–16` · `authService.ts:397–401`", "issue": "OTP là giá trị trong Redis và cột `persist_redis.value` (jsonb). resetToken nằm ngay trong **tên key**. Không băm.", "impact": "Ai đọc được bản backup PostgreSQL hoặc có quyền đọc Redis trong lúc Minh đang đặt lại mật khẩu sẽ thấy `591047` hoặc `password_reset_token:3f6c2a1e…` và dùng được ngay.", "fix": "Lưu HMAC-SHA256(otp, secret) và so HMAC; với resetToken, đặt key theo hash của token. So bằng `crypto.timingSafeEqual`."}, {"sev": "m", "title": "OTP bị in ra log ngoài production", "where": "`mailService.ts:86–91` · `constanst.ts:4` · `mailService.ts:47–51`", "issue": "Mọi môi trường có `NODE_ENV !== \"production\"` đều in mã OTP ra console. `NODE_ENV` mặc định `development` nếu không đặt. Thiếu cấu hình SMTP ở non-production còn được coi là gửi thành công.", "impact": "Một server staging/demo quên đặt `NODE_ENV=production` sẽ ghi `🔑 [DEV OTP] … minh.tran@example.com: 591047` vào log, nơi nhiều người (hoặc dịch vụ log bên thứ ba) đọc được.", "fix": "Chỉ in khi có cờ bật rõ ràng (ví dụ `DEV_LOG_OTP=true`), và từ chối khởi động nếu cờ này bật cùng SMTP thật."}, {"sev": "m", "title": "Lộ việc email đã có tài khoản", "where": "`authService.ts:59–61` (409 khi đăng ký) · `authService.ts:284–288` (không chạy argon2 khi không có user)", "issue": "Quên mật khẩu và gửi lại mã đã trả lời giống nhau (tốt). Nhưng đăng ký trả **409** \"Email này đã được sử dụng.\" và đăng nhập với email không tồn tại trả lời nhanh hơn rõ rệt vì bỏ qua argon2.", "impact": "Ai đó có danh sách email muốn biết ai đang thuê trọ qua Roomee: gửi đăng ký thử, nhận 409 là biết. Hoặc đo thời gian đăn     const m = s('marker', { id: 'ar-' + c, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
    m.append(s('path', { d: 'M0,0 L10,5 L0,10 z', fill: SM.colors[c] })); defs.append(m);
  });
  svg.append(defs);
  SM.edges.forEach(e => {
    const g = s('g', { class: 'edge' + (e.flow ? '' : ' static'), style: `--c:${SM.colors[e.c]}`, tabindex: e.flow ? 0 : -1, role: e.flow ? 'button' : null });
    if (!e.flow) g.removeAttribute('role');
    g.append(s('path', { d: e.d, 'marker-end': `url(#ar-${e.c})` }));
    const w = e.label.length * 6.4 + 12;
    g.append(s('rect', { x: e.lx - w / 2, y: e.ly - 11, width: w, height: 18, rx: 5 }));
    const t = s('text', { x: e.lx, y: e.ly + 2, 'text-anchor': 'middle' }); t.textContent = e.label; g.append(t);
    if (e.flow) { g.addEventListener('click', () => selectFlow(e.flow)); g.addEventListener('keydown', ev => { if (ev.key === 'Enter') selectFlow(e.flow); }); const tt = s('title', {}); tt.textContent = 'Bấm để chạy luồng này trong debugger'; g.append(tt); }
    svg.append(g);
  });
  SM.nodes.forEach(n => {
    const g = s('g', { class: 'node' + (n.trans ? ' trans' : '') });
    g.append(s('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: 10 }));
    n.lines.forEach((ln, i) => { const t = s('text', { x: n.x + 12, y: n.y + 22 + i * 17, class: i ? 's' : '' }); t.textContent = ln; g.append(t); });
    svg.append(g);
  });
  root.append(h('div', { class: 'sm' }, svg));
}

/* ================= NỘI DUNG CHI TIẾT ================= */
function stepArticle(st) {
  const a = h('article', { class: 'step', id: anchor(st.id) });
  a.append(h('div', { class: 'shead' }, h('span', { class: 'sno' }, st.id), h('h3', null, st.title), st.lane ? h('span', { class: 'badge ln-' + st.lane }, LANE[st.lane].label) : null, st.code && st.code[0] ? h('code', { class: 'loc' }, st.code.map(c => loc(c.f, c.a, c.b)).join(' · ')) : null));
  if (st.sum) a.append(h('p', { class: 'sum', html: rich(st.sum) }));
  if (st.idea) a.append(h('div', { class: 'idea', html: '💡 <b>Hình dung:</b> ' + rich(st.idea) }));
  (st.code || []).forEach(cb => { if (cb.text) a.append(h('p', { class: 'sum', html: rich(cb.text) })); a.append(annotated(cb, cb.lane || st.lane)); });
  if (st.ba) a.append(beforeAfter(st.ba));
  if (st.br && st.br.length) a.append(h('div', { class: 'br' }, h('h5', null, 'Nhánh rẽ'), h('ul', null, st.br.map(b => h('li', { html: rich(b) })))));
  if (st.nh && st.nh.length) a.append(h('div', { class: 'br nothandled' }, h('h5', null, 'Code hiện KHÔNG xử lý'), h('ul', null, st.nh.map(b => h('li', { html: rich(b) })))));
  if (st.more) a.append(h('div', { class: 'prose', html: st.more.map(p => `<p>${rich(p)}</p>`).join('') }));
  return a;
}
function table(cols, rows, cls) {
  return h('div', { class: 'tblwrap' }, h('table', { class: 'tbl ' + (cls || '') }, h('tr', null, cols.map(c => h('th', null, c))), rows.map(r => h('tr', { class: r._cls || '' }, (r.cells || r).map((c, i) => h('td', { class: (r.tdc && r.tdc[i]) || '', html: rich(c) }))))));
}
function build() {
  const app = $('#app');
  app.append(h('header', { class: 'top' },
    h('h1', null, D.meta.title),
    h('p', { class: 'lede', html: rich(D.meta.lede) }),
    h('div', { class: 'meta' },
      h('span', { class: 'chip' }, 'Repo ', h('b', null, D.meta.repo)),
      h('span', { class: 'chip' }, 'Commit ', h('b', { class: 'mono' }, D.meta.commit.slice(0, 12))),
      h('span', { class: 'chip' }, 'Ngày commit ', h('b', null, D.meta.commitDate)),
      h('span', { class: 'chip' }, 'Đọc code lúc ', h('b', null, D.meta.readAt)))));
  app.append(h('p', { class: 'intro', html: rich(D.meta.how) }));
  const legend = h('div', { class: 'legend' }, D.lanes.map(l => h('span', { class: 'badge ln-' + l.id, title: l.sub }, l.label)));
  const s1 = h('section', { class: 'block', id: 'sec-debugger' }, h('h2', null, 'Debugger: bấm Step Over qua từng dòng code', h('span', { class: 'k' }, '§1')), legend);
  app.append(s1); buildDebugger(s1);
  const s1b = h('section', { class: 'block', id: 'sec-state' }, h('h2', null, 'Sơ đồ trạng thái tài khoản', h('span', { class: 'k' }, '§1b')), h('p', { class: 'intro', html: rich(D.stateMachine.intro) }));
  app.append(s1b); buildStateMachine(s1b);
  s1b.append(h('div', { class: 'prose', html: D.stateMachine.notes.map(p => `<p>${rich(p)}</p>`).join('') }));

  const s2 = h('section', { class: 'block', id: 'sec-found' }, h('h2', null, 'Nền tảng dùng chung', h('span', { class: 'k' }, '§2')), h('p', { class: 'intro', html: rich(D.foundIntro) }));
  D.found.forEach(st => s2.append(stepArticle(st)));
  app.append(s2);

  const s4 = h('section', { class: 'block', id: 'sec-data' }, h('h2', null, 'Bộ dữ liệu mẫu xuyên suốt', h('span', { class: 'k' }, '§4')), h('p', { class: 'intro', html: rich(D.sample.intro) }));
  s4.append(h('div', { class: 'cast' }, D.sample.cards.map(c => h('div', null, h('h4', null, c[0]), h('div', { class: 'v', html: rich(c[1]) })))));
  app.append(s4);

  const s3 = h('section', { class: 'block', id: 'sec-flows' }, h('h2', null, 'Giải thích chi tiết theo thứ tự dữ liệu chạy', h('span', { class: 'k' }, '§3')), h('p', { class: 'intro', html: rich(D.flowsIntro) }));
  app.append(s3);
  D.flows.forEach(f => {
    const head = h('div', { class: 'flowhead', id: 'flow-' + f.id },
      h('div', { class: 'row1' }, h('span', { class: 'fno' }, f.no), h('h2', null, f.title), h('span', { class: 'ep' }, f.endpoint),
        h('button', { type: 'button', class: 'linkbtn', onclick: () => selectFlow(f.id) }, '▶ Chạy luồng này trong debugger')),
      h('p', { html: rich(f.summary) }),
      f.idea ? h('div', { class: 'idea', html: '💡 <b>Hình dung:</b> ' + rich(f.idea) }) : null);
    s3.append(head);
    f.details.forEach(st => s3.append(stepArticle(st)));
    s3.append(h('h3', { style: 'margin-top:30px;font-size:16px' }, `Tóm tắt luồng ${f.no}: ${f.title}`));
    s3.append(table(['Input', 'Kiểm tra', 'Ghi vào DB / Redis', 'Output', 'Lỗi có thể gặp'], [f.table]));
  });

  const s5 = h('section', { class: 'block', id: 'sec-trace' }, h('h2', null, 'Chạy tay: tự làm máy tính', h('span', { class: 'k' }, '§4b')), h('p', { class: 'intro', html: rich(D.trace.intro) }));
  D.trace.tables.forEach(t => { s5.append(h('h3', { style: 'margin-top:22px;font-size:17px' }, t.title)); s5.append(h('p', { class: 'intro', html: rich(t.desc) })); s5.append(table(t.cols, t.rows, 'trace')); });
  app.append(s5);

  const s6 = h('section', { class: 'block', id: 'sec-timeline' }, h('h2', null, 'Một tuần của Minh', h('span', { class: 'k' }, '§6a')), h('p', { class: 'intro', html: rich(D.timeline.intro) }));
  const tl = h('div', { class: 'tl' });
  D.timeline.events.forEach(ev => tl.append(h('div', { class: 'ev', style: `--c:var(--l-${ev.lane || 'ui'})` },
    h('div', { class: 'when' }, ev.when), h('div', { class: 'what', html: rich(ev.what) }),
    h('div', null, h('span', { class: 'state' }, ev.state), ' ', ev.link ? h('a', { href: '#' + anchor(ev.link) }, 'mục ' + ev.link.replace(/^#flow-/, 'luồng ')) : null),
    h('div', { class: 'db' }, ev.db.map(x => h('span', { html: rich(x) }))))));
  s6.append(tl); app.append(s6);

  const s7 = h('section', { class: 'block', id: 'sec-risk' }, h('h2', null, 'Điểm cần để ý & rủi ro', h('span', { class: 'k' }, '§6b')), h('p', { class: 'intro', html: rich(D.risksIntro) }));
  D.risks.forEach(r => s7.append(h('div', { class: 'risk sv-' + r.sev },
    h('div', { class: 'bar' }),
    h('div', { class: 'in' }, h('h4', null, h('span', { class: 'sev' }, { h: 'Cao', m: 'TB', l: 'Thấp', ok: 'Ổn' }[r.sev]), r.title),
      h('dl', null, h('dt', null, 'Ở đâu'), h('dd', { html: rich(r.where) }), h('dt', null, 'Vấn đề'), h('dd', { html: rich(r.issue) }), h('dt', null, 'Kịch bản'), h('dd', { html: rich(r.impact) }), h('dt', null, 'Gợi ý sửa'), h('dd', { html: rich(r.fix) }))))));
  app.append(s7);

  const s8 = h('section', { class: 'block', id: 'sec-glossary' }, h('h2', null, 'Bảng thuật ngữ', h('span', { class: 'k' }, '§6c')));
  s8.append(h('div', { class: 'gl' }, D.glossary.map(g => [h('div', null, g[0]), h('div', { html: rich(g[1]) })])));
  app.append(s8);
  app.append(h('footer', { html: rich(D.meta.footer) }));
  buildToc();
}
function buildToc() {
  const toc = $('#toc');
  toc.append(h('div', { class: 'brand' }, 'Roomee · Auth', h('small', null, 'đọc code từ nút bấm tới DB')));
  const g = (title, items) => { toc.append(h('h4', null, title)); items.forEach(x => toc.append(x)); };
  const link = (href, n, txt) => h('a', { href: '#' + href, 'data-t': href }, h('span', { class: 'n' }, n), h('span', null, txt));
  g('Tổng quan', [link('sec-debugger', '§1', 'Debugger'), link('sec-state', '§1b', 'Trạng thái tài khoản'), link('sec-found', '§2', 'Nền tảng dùng chung'), link('sec-data', '§4', 'Dữ liệu mẫu')]);
  const sub = h('div', { class: 'sub', id: 'toc-found' }, D.found.map(st => link(anchor(st.id), st.id, st.short || st.title)));
  $('a[data-t="sec-found"]', toc).after(sub);
  toc.append(h('h4', null, 'Các luồng (§3)'));
  D.flows.forEach(f => {
    toc.append(link('flow-' + f.id, f.no, f.title));
    toc.append(h('div', { class: 'sub', id: 'toc-' + f.id }, f.details.map(st => link(anchor(st.id), st.id, st.short || st.title))));
  });
  g('Cuối trang', [link('sec-trace', '§4b', 'Chạy tay'), link('sec-timeline', '§6a', 'Một tuần của Minh'), link('sec-risk', '§6b', 'Rủi ro'), link('sec-glossary', '§6c', 'Thuật ngữ')]);
  toc.addEventListener('click', e => { if (e.target.closest('a') && matchMedia('(max-width:1100px)').matches) toc.classList.remove('open'); });
  $('#tocbtn').addEventListener('click', () => toc.classList.toggle('open'));
  const targets = $$('a[data-t]', toc).map(a => ({ a, el: document.getElementById(a.dataset.t) })).filter(x => x.el);
  const onScroll = () => {
    const y = scrollY, H = document.documentElement.scrollHeight - innerHeight;
    $('#progress').style.width = (H > 0 ? (y / H) * 100 : 0) + '%';
    let best = null;
    for (const t of targets) { if (t.el.getBoundingClientRect().top < 120) best = t; }
    targets.forEach(t => t.a.classList.toggle('on', t === best));
    $$('.sub', toc).forEach(s => s.classList.remove('open'));
    if (best) { const s = best.a.closest('.sub') || (best.a.nextElementSibling && best.a.nextElementSibling.classList.contains('sub') ? best.a.nextElementSibling : null); if (s) s.classList.add('open'); }
  };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
}
build();
loadScenario();
requestAnimationFrame(() => { relayout(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { relayout(); drawLanes(); go(dbg.i); });
